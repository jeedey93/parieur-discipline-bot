name: NFL Weekly Predictions

on:
  schedule:
    - cron: "0 13 * * 2"  # Every Tuesday at 13:00 UTC (9am ET / Montreal)
  workflow_dispatch:

jobs:
  run-nfl-predictions:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      NFL_RUN_TIME: weekly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables file
        run: |
          echo "ODDS_API_KEY=${ODDS_API_KEY}" > .env
          echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}" >> .env

      - name: Generate NFL predictions
        run: python scripts/generate_nfl_predictions.py

      - name: Build NFL page
        run: python scripts/generate_nfl_page.py

      - name: Commit and push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "NFL Week predictions for $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push origin HEAD:master; then
                break
              elif [ $i -lt 3 ]; then
                echo "Push failed (attempt $i), rebasing..."
                git pull --rebase origin master
              else
                echo "Push failed after 3 attempts"
                exit 1
              fi
            done
          else
            echo "No changes to commit"
          fi
