name: NFL Weekly Results

on:
  schedule:
    - cron: "0 13 * * 3"  # Every Wednesday at 13:00 UTC (9am ET), day after Monday Night Football
  workflow_dispatch:

jobs:
  run-nfl-results:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables file
        run: |
          echo "ODDS_API_KEY=${ODDS_API_KEY}" > .env
          echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}" >> .env

      - name: Analyze NFL results
        run: |
          if [ -f scripts/analyze_nfl_results.py ]; then
            python scripts/analyze_nfl_results.py
          else
            echo "analyze_nfl_results.py not yet implemented — skipping"
          fi

      - name: Rebuild NFL page
        run: python scripts/generate_nfl_page.py

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "NFL results update for $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push --set-upstream https://${GH_PAT}@github.com/${{ github.repository }} HEAD:master; then
                break
              elif [ $i -lt 3 ]; then
                echo "Push failed (attempt $i), rebasing..."
                git fetch https://${GH_PAT}@github.com/${{ github.repository }} master
                git rebase FETCH_HEAD
              else
                echo "Push failed after 3 attempts"
                exit 1
              fi
            done
          else
            echo "No changes to commit"
          fi
