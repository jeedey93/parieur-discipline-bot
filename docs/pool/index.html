<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hockey Pool | Parieur Discipliné</title>
  <link rel="icon" type="image/png" href="../parieur_discipline_icon_1024.png">
  <link rel="apple-touch-icon" href="../parieur_discipline_icon_1024.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hockey Pool">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rink: #07111f;
      --red: #c8102e;
      --gold: #ffb81c;
      --silver: #a8b2be;
      --green: #22c55e;
      --line: rgba(255,255,255,0.08);
      --nav-h: 44px;
    }
    body {
      background: var(--rink);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%);
      min-height: 100vh;
      font-family: 'Barlow Condensed', sans-serif;
      color: white;
      padding-top: var(--nav-h);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── NAV ── */
    .site-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(7,17,31,0.92); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .site-nav-inner {
      max-width: 1320px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: var(--nav-h); padding: 0 1.5rem;
    }
    .site-nav-brand {
      font-family: 'Bebas Neue', cursive; font-size: 1.5rem;
      color: var(--gold); letter-spacing: 4px; text-decoration: none;
    }
    .site-nav-links { display: flex; align-items: center; gap: 0.5rem; }
    .site-nav-links a {
      font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600;
      color: var(--silver); text-decoration: none; padding: 0.3rem 0.8rem;
      border-radius: 5px; letter-spacing: 1.5px; transition: color 0.15s, background 0.15s;
    }
    .site-nav-links a:hover { color: white; background: rgba(255,255,255,0.07); }
    .site-nav-links a.active { color: var(--gold); background: rgba(255,184,28,0.1); }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
    }
    .hero h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      letter-spacing: 6px;
      line-height: 1;
      text-shadow: 0 0 40px rgba(200,16,46,0.3), 0 2px 12px rgba(0,0,0,0.8);
    }
    .hero h1 span { color: var(--gold); }
    .hero-sub {
      color: var(--silver);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 0.4rem;
      opacity: 0.7;
    }

    /* ── LEAGUE LIST ── */
    .leagues-wrap {
      width: 100%;
      max-width: 480px;
      padding: 0 1.5rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 4px;
    }

    .league-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: white;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .league-card:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,184,28,0.3);
      transform: translateY(-1px);
    }
    .league-card:active { transform: translateY(0); }

    .league-card-icon {
      font-size: 1.8rem;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,184,28,0.08);
      border: 1px solid rgba(255,184,28,0.15);
      border-radius: 10px;
    }

    .league-card-info { flex: 1; min-width: 0; }
    .league-card-name {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.15rem;
      letter-spacing: 3px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .league-card-code {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1.5px;
      margin-top: 2px;
      font-weight: 600;
    }

    .league-card-arrow {
      color: rgba(255,184,28,0.4);
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: color 0.15s, transform 0.15s;
    }
    .league-card:hover .league-card-arrow {
      color: var(--gold);
      transform: translateX(3px);
    }

    .league-card-skeleton {
      height: 74px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .error-msg {
      text-align: center;
      color: rgba(255,122,138,0.8);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      padding: 1rem;
    }

    /* ── ADMIN SECTION ── */
    .admin-trigger {
      margin-top: 1.5rem;
      text-align: center;
    }
    .btn-admin {
      background: none;
      border: none;
      font-family: 'Bebas Neue', cursive;
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.15);
      cursor: pointer;
      padding: 6px 10px;
      transition: color 0.15s;
    }
    .btn-admin:hover { color: rgba(255,255,255,0.4); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #0d1b2e;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      width: 100%; max-width: 380px;
    }
    .modal-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.2rem; letter-spacing: 3px;
      color: white; margin-bottom: 1.25rem;
    }
    .modal-title span { color: var(--gold); }
    .field-group { margin-bottom: 1rem; }
    .field-label {
      font-family: 'Bebas Neue', cursive;
      font-size: 0.72rem; letter-spacing: 2px;
      color: var(--silver); display: block; margin-bottom: 5px;
    }
    .field-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      padding: 0.6rem 0.85rem;
      color: white;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem; font-weight: 600;
      outline: none;
      transition: border-color 0.15s;
    }
    .field-input:focus { border-color: rgba(255,184,28,0.5); }
    .field-input.error { border-color: rgba(200,16,46,0.6); }
    .modal-error {
      background: rgba(200,16,46,0.1);
      border: 1px solid rgba(200,16,46,0.3);
      border-radius: 6px;
      padding: 0.5rem 0.8rem;
      font-size: 0.82rem; color: #ff7a8a;
      margin-bottom: 1rem; display: none;
    }
    .modal-error.show { display: block; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 0.25rem; }
    .modal-btn {
      font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px;
      border-radius: 5px; padding: 6px 18px; cursor: pointer; border: 1px solid;
      transition: background 0.15s;
    }
    .modal-btn-confirm {
      background: rgba(255,184,28,0.12); border-color: rgba(255,184,28,0.35); color: var(--gold);
    }
    .modal-btn-confirm:hover { background: rgba(255,184,28,0.22); }
    .modal-btn-confirm:disabled { opacity: 0.4; cursor: default; }
    .modal-btn-cancel {
      background: none; border-color: rgba(255,255,255,0.12); color: var(--silver);
    }
    .modal-btn-cancel:hover { background: rgba(255,255,255,0.06); }

    .success-box {
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: none;
    }
    .success-box.show { display: block; }
    .success-box-title {
      font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px;
      color: var(--green); margin-bottom: 6px;
    }
    .success-box-row {
      font-size: 0.82rem; color: rgba(255,255,255,0.6); margin-bottom: 3px;
    }
    .success-box-row strong { color: white; }
  </style>
</head>
<body>

<nav class="site-nav">
  <div class="site-nav-inner">
    <a class="site-nav-brand" href="../index.html">Parieur Discipliné</a>
    <div class="site-nav-links">
      <a href="./index.html" class="active">Hockey Pool</a>
    </div>
  </div>
</nav>

<div class="hero">
  <h1>🏒 Hockey <span>Pool</span></h1>
  <p class="hero-sub">2026–27 NHL Season · Select your league</p>
</div>

<div class="leagues-wrap">
  <div class="section-label">Leagues</div>
  <div id="league-list">
    <div class="league-card-skeleton"></div>
    <div class="league-card-skeleton"></div>
    <div class="league-card-skeleton"></div>
  </div>
  <div class="admin-trigger">
    <button class="btn-admin" onclick="showAdminPrompt()">+ Create League</button>
  </div>
</div>

<!-- Admin password modal -->
<div class="modal-overlay hidden" id="modal-admin-pw">
  <div class="modal-box">
    <div class="modal-title">Admin <span>Access</span></div>
    <div class="modal-error" id="admin-pw-error"></div>
    <div class="field-group">
      <label class="field-label" for="input-admin-pw">Password</label>
      <input class="field-input" id="input-admin-pw" type="password" placeholder="Admin password" autocomplete="off">
    </div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" onclick="closeAdminPrompt()">Cancel</button>
      <button class="modal-btn modal-btn-confirm" onclick="checkAdminPw()">Enter</button>
    </div>
  </div>
</div>

<!-- Create league modal -->
<div class="modal-overlay hidden" id="modal-create">
  <div class="modal-box">
    <div class="modal-title">Create <span>League</span></div>
    <div class="modal-error" id="create-error"></div>
    <div class="success-box" id="create-success">
      <div class="success-box-title">✓ League Created</div>
      <div class="success-box-row">Name: <strong id="success-name"></strong></div>
      <div class="success-box-row">Code: <strong id="success-code"></strong></div>
      <div class="success-box-row">Password: <strong id="success-token"></strong></div>
    </div>
    <div id="create-form">
      <div class="field-group">
        <label class="field-label" for="input-league-name">League Name</label>
        <input class="field-input" id="input-league-name" type="text" maxlength="40" placeholder="e.g. Pool McKenna" autocomplete="off">
      </div>
      <div class="field-group">
        <label class="field-label" for="input-league-token">Password</label>
        <input class="field-input" id="input-league-token" type="text" maxlength="40" placeholder="Members will use this to join" autocomplete="off">
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" id="create-cancel-btn" onclick="closeCreateModal()">Cancel</button>
      <button class="modal-btn modal-btn-confirm" id="create-confirm-btn" onclick="createLeague()">Create</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';

  const ICONS = ['🏒', '🥅', '⛸️', '🏆', '🧊'];

  async function loadLeagues() {
    const list = document.getElementById('league-list');
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/pool_leagues?select=code,name&order=created_at.asc`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
      );
      if (!res.ok) throw new Error();
      const leagues = await res.json();

      if (!leagues.length) {
        list.innerHTML = '<div class="error-msg">No leagues found.</div>';
        return;
      }

      list.innerHTML = leagues.map((league, i) => `
        <a class="league-card" href="/pool/standings?league=${encodeURIComponent(league.code)}">
          <div class="league-card-icon">${ICONS[i % ICONS.length]}</div>
          <div class="league-card-info">
            <div class="league-card-name">${escHtml(league.name)}</div>
            <div class="league-card-code">${escHtml(league.code)}</div>
          </div>
          <div class="league-card-arrow">›</div>
        </a>
      `).join('');
    } catch(_) {
      list.innerHTML = '<div class="error-msg">Could not load leagues — check your connection.</div>';
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Admin password gate ───────────────────────────────────────────────────
  const ADMIN_PW = 'parieur2026';

  function showAdminPrompt() {
    document.getElementById('input-admin-pw').value = '';
    document.getElementById('admin-pw-error').classList.remove('show');
    document.getElementById('modal-admin-pw').classList.remove('hidden');
    setTimeout(() => document.getElementById('input-admin-pw').focus(), 50);
  }
  function closeAdminPrompt() {
    document.getElementById('modal-admin-pw').classList.add('hidden');
  }
  function checkAdminPw() {
    const val = document.getElementById('input-admin-pw').value;
    if (val === ADMIN_PW) {
      closeAdminPrompt();
      openCreateModal();
    } else {
      const err = document.getElementById('admin-pw-error');
      err.textContent = 'Wrong password.';
      err.classList.add('show');
      document.getElementById('input-admin-pw').value = '';
      document.getElementById('input-admin-pw').focus();
    }
  }

  // ── Create league modal ───────────────────────────────────────────────────
  function openCreateModal() {
    document.getElementById('input-league-name').value = '';
    document.getElementById('input-league-token').value = '';
    document.getElementById('create-error').classList.remove('show');
    document.getElementById('create-success').classList.remove('show');
    document.getElementById('create-form').style.display = '';
    document.getElementById('create-confirm-btn').style.display = '';
    document.getElementById('create-confirm-btn').disabled = false;
    document.getElementById('create-confirm-btn').textContent = 'Create';
    document.getElementById('create-cancel-btn').textContent = 'Cancel';
    document.getElementById('modal-create').classList.remove('hidden');
    setTimeout(() => document.getElementById('input-league-name').focus(), 50);
  }
  function closeCreateModal() {
    document.getElementById('modal-create').classList.add('hidden');
  }

  function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  async function createLeague() {
    const name = document.getElementById('input-league-name').value.trim();
    const token = document.getElementById('input-league-token').value.trim();
    const errEl = document.getElementById('create-error');
    const btn = document.getElementById('create-confirm-btn');

    errEl.classList.remove('show');
    if (!name) { errEl.textContent = 'Enter a league name.'; errEl.classList.add('show'); return; }
    if (!token) { errEl.textContent = 'Enter a password for the league.'; errEl.classList.add('show'); return; }

    btn.disabled = true;
    btn.textContent = '…';

    // Generate a unique code
    let code, attempts = 0;
    do {
      code = generateCode();
      const check = await fetch(
        `${SUPABASE_URL}/rest/v1/pool_leagues?code=eq.${code}&select=code`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
      );
      const rows = await check.json();
      if (!rows.length) break;
      attempts++;
    } while (attempts < 10);

    // Insert into Supabase
    const res = await fetch(`${SUPABASE_URL}/rest/v1/pool_leagues`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ code, name, access_token: token }),
    });

    if (!res.ok) {
      errEl.textContent = 'Failed to create league — try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Create';
      return;
    }

    // Show success
    document.getElementById('create-form').style.display = 'none';
    document.getElementById('create-confirm-btn').style.display = 'none';
    document.getElementById('create-cancel-btn').textContent = 'Close';
    document.getElementById('success-name').textContent = name;
    document.getElementById('success-code').textContent = code;
    document.getElementById('success-token').textContent = token;
    document.getElementById('create-success').classList.add('show');

    // Refresh league list
    loadLeagues();
  }

  loadLeagues();

  // Enter key support in modals
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('modal-admin-pw').classList.contains('hidden')) { checkAdminPw(); return; }
    if (!document.getElementById('modal-create').classList.contains('hidden')) { createLeague(); return; }
  });
</script>
</body>
</html>
