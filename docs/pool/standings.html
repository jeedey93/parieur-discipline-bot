<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pool Standings | Parieur Discipliné</title>
    <link rel="icon" type="image/png" href="../parieur_discipline_icon_1024.png">
  <link rel="apple-touch-icon" href="../parieur_discipline_icon_1024.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pool McKenna">
  <meta name="application-name" content="Pool McKenna">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap"
          rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --rink: #07111f;
          --red: #c8102e;
          --gold: #ffb81c;
          --silver: #a8b2be;
          --green: #22c55e;
          --blue: #7db4ff;
          --pink: #ff7a8a;
          --line: rgba(255,255,255,0.08);
          --nav-h: 44px;
        }
        body {
          background: var(--rink);
          background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(26,58,110,0.6) 0%, transparent 70%);
          min-height: 100vh;
          font-family: 'Barlow Condensed', sans-serif;
          color: white;
          padding-top: var(--nav-h);
        }

        /* ── NAV ── */
        .site-nav {
          position: fixed; top: 0; left: 0; right: 0; z-index: 100;
          background: rgba(7,17,31,0.92); border-bottom: 1px solid var(--line);
          backdrop-filter: blur(12px);
        }
        .site-nav-inner {
          max-width: 1100px; margin: 0 auto;
          display: flex; align-items: center; justify-content: space-between;
          height: var(--nav-h); padding: 0 1.5rem;
        }
        .site-nav-brand {
          font-family: 'Bebas Neue', cursive; font-size: 1.5rem;
          color: var(--gold); letter-spacing: 4px; text-decoration: none;
          flex-shrink: 0;
        }
        .site-nav-links { display: flex; align-items: center; gap: 0.5rem; }
        .site-nav-links a {
          font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600;
          color: var(--silver); text-decoration: none; padding: 0.3rem 0.8rem;
          border-radius: 5px; letter-spacing: 1.5px;
          transition: color 0.15s, background 0.15s;
        }
        .site-nav-links a:hover { color: white; background: rgba(255,255,255,0.07); }
        .site-nav-links a.active { color: var(--gold); background: rgba(255,184,28,0.1); }
        .nav-hamburger {
          display: none; flex-direction: column; justify-content: center; gap: 5px;
          width: 36px; height: 36px; cursor: pointer; border: none;
          background: none; padding: 6px; border-radius: 6px;
        }
        .nav-hamburger span { display: block; height: 2px; background: var(--silver); border-radius: 2px; transition: background 0.15s; }
        .nav-hamburger:hover span { background: white; }
        .nav-drawer {
          display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
          z-index: 99; background: rgba(7,17,31,0.97); backdrop-filter: blur(16px);
          flex-direction: column; gap: 0.25rem; padding: 1.25rem 1.5rem;
          border-top: 1px solid var(--line);
        }
        .nav-drawer.open { display: flex; }
        .nav-drawer a {
          font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 3px;
          color: var(--silver); text-decoration: none; padding: 0.65rem 0.75rem;
          border-radius: 8px; transition: color 0.15s, background 0.15s;
        }
        .nav-drawer a:hover { color: white; background: rgba(255,255,255,0.06); }
        .nav-drawer a.active { color: var(--gold); background: rgba(255,184,28,0.08); }
        @media (max-width: 700px) {
          .site-nav-links { display: none; }
          .nav-hamburger { display: flex; }
        }

        /* ── LAYOUT ── */
        .page-wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
        @media (min-width: 861px) { .page-wrap { padding: 2rem 1.5rem 4rem; } }

        /* ── HEADER ── */
        header { text-align: center; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        header h1 {
          font-family: 'Bebas Neue', cursive;
          font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: 5px; line-height: 1;
          text-shadow: 0 0 30px rgba(200,16,46,0.4), 0 2px 8px rgba(0,0,0,0.8);
        }
        header h1 span { color: var(--gold); }
        @media (min-width: 861px) { header h1 { font-size: clamp(2.4rem, 4vw, 3.4rem); } }
        .league-code-badge {
          display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem;
          font-size: 0.75rem; font-weight: 700; color: var(--silver);
          letter-spacing: 2px; text-transform: uppercase;
        }
        .league-code-badge span {
          font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 3px;
          color: var(--gold); background: rgba(255,184,28,0.1);
          border: 1px solid rgba(255,184,28,0.3); border-radius: 4px; padding: 1px 10px;
        }
        .header-controls { display: flex; align-items: center; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .btn-sync {
          font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 1.5px;
          background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
          color: var(--green); border-radius: 6px; padding: 8px 12px;
          cursor: pointer; transition: background 0.2s, border-color 0.2s;
        }
        .btn-sync:hover { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.5); }
        .view-count {
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 600;
          color: rgba(255,255,255,0.3); letter-spacing: 0.5px; white-space: nowrap;
        }
        .view-count span { color: rgba(255,255,255,0.55); }

        /* ── VIEW TABS ── */
        .view-tabs {
          display: flex; gap: 4px; margin-bottom: 1.25rem;
          background: rgba(255,255,255,0.03);
          border: 1px solid var(--line); border-radius: 8px; padding: 4px;
          align-items: center;
        }
        .view-tab {
          font-family: 'Bebas Neue', cursive; letter-spacing: 2px;
          padding: 8px 14px; border-radius: 5px; cursor: pointer; flex: 1;
          text-align: center; color: var(--silver);
          transition: background 0.15s, color 0.15s; font-size: 0.85rem;
        }
        .view-tab:hover { color: white; }
        .view-tab.active { background: rgba(255,184,28,0.12); color: var(--gold); }
        @media (min-width: 861px) { .view-tab { font-size: 1rem; padding: 7px 20px; } }
        .live-indicator {
          display: flex; align-items: center; gap: 5px; margin-left: auto;
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700;
          color: #ff4444; white-space: nowrap; padding: 0 6px; flex-shrink: 0;
        }
        .live-indicator::before {
          content: ''; display: inline-block; width: 7px; height: 7px;
          border-radius: 50%; background: #ff4444;
          animation: live-pulse 1.2s ease-in-out infinite;
        }

        /* ── SKELETON ── */
        .skeleton-row {
          height: 48px; background: rgba(255,255,255,0.04);
          border-radius: 6px; margin-bottom: 4px;
          animation: skeleton-pulse 1.4s ease-in-out infinite;
        }
        .skeleton-row:nth-child(2) { opacity: 0.8; animation-delay: 0.1s; }
        .skeleton-row:nth-child(3) { opacity: 0.65; animation-delay: 0.2s; }
        .skeleton-row:nth-child(4) { opacity: 0.5; animation-delay: 0.3s; }
        .skeleton-row:nth-child(5) { opacity: 0.35; animation-delay: 0.4s; }
        @keyframes skeleton-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }

        /* ── LEADERBOARD ── */
        .leaderboard {
          background: rgba(255,255,255,0.03); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; margin-bottom: 1.75rem;
        }

        /* Tier row backgrounds — defined as gradients so .active can layer on top */
        .lb-row.rank-1 {
          background: linear-gradient(90deg, rgba(255,184,28,0.07) 0%, rgba(255,184,28,0.02) 60%, transparent 100%);
          border-left: 3px solid rgba(255,184,28,0.6);
        }
        .lb-row.rank-2 {
          background: linear-gradient(90deg, rgba(192,200,212,0.05) 0%, transparent 60%);
          border-left: 3px solid rgba(192,200,212,0.3);
        }
        .lb-row.rank-3 {
          background: linear-gradient(90deg, rgba(205,127,50,0.05) 0%, transparent 60%);
          border-left: 3px solid rgba(205,127,50,0.3);
        }

        /*
         * FIX 3: .active is now an additive overlay via box-shadow + pseudo-element
         * so the rank-N gradient still shows through underneath.
         * We keep border-left-color override for the active stripe.
         */
        .lb-row.active {
          box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), inset 4px 0 0 rgba(255,255,255,0.35);
          background-image: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 50%, transparent 100%);
        }
        /* Rank-1 + active: merge both gold gradients so neither wipes the other */
        .lb-row.rank-1.active {
          background: linear-gradient(90deg, rgba(255,184,28,0.13) 0%, rgba(255,184,28,0.05) 60%, transparent 100%);
          border-left: 3px solid var(--gold);
          box-shadow: inset 0 0 0 1px rgba(255,184,28,0.22);
        }
        .lb-row.rank-2.active {
          background: linear-gradient(90deg, rgba(192,200,212,0.05) 0%, transparent 60%);
          border-left: 3px solid rgba(255,255,255,0.35);
          box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        }
        .lb-row.rank-3.active {
          background: linear-gradient(90deg, rgba(205,127,50,0.05) 0%, transparent 60%);
          border-left: 3px solid rgba(255,255,255,0.35);
          box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
        }

        /* Divider between podium and rest of field */
        .lb-tier-divider {
          height: 1px;
          background: linear-gradient(90deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
          position: relative;
        }
        .lb-tier-divider::after {
          content: 'REST OF FIELD';
          position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem;
          font-weight: 700; letter-spacing: 2px;
          color: rgba(255,255,255,0.2); background: #07111f; padding: 0 6px;
        }

        .lb-row {
          display: grid;
          grid-template-columns: 36px 1fr 44px 52px 52px 52px 60px 52px 52px 52px 60px;
          align-items: center; padding: 0.75rem 1rem; gap: 0.5rem;
          border-bottom: 1px solid rgba(255,255,255,0.05);
          cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
          border-left: 3px solid transparent;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-row:hover:not(.active) { background: rgba(255,255,255,0.04); }
        .lb-row.header {
          background: rgba(255,255,255,0.03);
          border-bottom: 1px solid rgba(255,255,255,0.1);
          cursor: default; padding: 0.45rem 1rem;
          border-left: 3px solid transparent; box-shadow: none;
        }
        .lb-row.header:hover { background: rgba(255,255,255,0.03); }
        @media (min-width: 861px) { .lb-row { padding: 0.85rem 1.25rem; } }
        @media (max-width: 600px) {
          .lb-row { grid-template-columns: 30px 1fr 52px 44px 48px 56px; }
          .lb-col-hide { display: none; }
          .lb-col-hide-mobile { display: none; }
        }

        .lb-rank {
          display: flex; align-items: center; justify-content: center;
          font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px;
          color: var(--silver); text-align: center;
        }
        .lb-rank.gold   { color: var(--gold); }
        .lb-rank.silver { color: #c0c8d4; }
        .lb-rank.bronze { color: #cd7f32; }
        .lb-rank-crown { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .lb-rank-crown-icon {
          font-size: 0.65rem; line-height: 1;
          animation: crown-glow 3s ease-in-out infinite;
        }
        @keyframes crown-glow {
          0%, 100% { filter: drop-shadow(0 0 3px rgba(255,184,28,0.6)); }
          50%       { filter: drop-shadow(0 0 8px rgba(255,184,28,1)); }
        }
        .lb-rank-num { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px; }

        .lb-name { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 2px; color: white; }
        .lb-row.active .lb-name { color: var(--gold); }
        @media (min-width: 861px) { .lb-rank-num { font-size: 1.3rem; } .lb-name { font-size: 1.15rem; } }
        .lb-stat { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--silver); text-align: right; }
        .lb-stat.pts { color: white; font-size: 1rem; }
        .lb-row.active .lb-stat.pts { color: var(--gold); }
        .lb-stat.gap { color: rgba(255,80,80,0.7); font-size: 0.8rem; }
        .lb-stat.gap.leader { color: var(--green); }
        .lb-stat.delta { font-size: 0.78rem; font-weight: 700; min-width: 40px; text-align: right; }
        .lb-stat.delta.pos { color: var(--green); }
        .lb-stat.delta.neg { color: rgba(255,80,80,0.7); }
        .lb-stat.delta.zero { color: rgba(255,255,255,0.2); }
        .lb-stat.pos-f { color: var(--pink); }
        .lb-stat.pos-d { color: var(--blue); }
        .lb-stat.pos-g { color: var(--gold); }
        @media (min-width: 861px) { .lb-stat { font-size: 1rem; } .lb-stat.pts { font-size: 1.2rem; } }
        .lb-col-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.3); text-align: right; letter-spacing: 2px; text-transform: uppercase; }
        .lb-col-label.left { text-align: left; }
        .sort-hdr:hover { color: rgba(255,184,28,0.8); }
        .sort-hdr { transition: color 0.15s; }

        /* ── INSIGHTS ── */
        .insights {
          display: grid; grid-template-columns: repeat(2, 1fr);
          gap: 0.6rem; margin-bottom: 1.25rem;
        }
        .insight-card {
          background: rgba(255,255,255,0.03); border: 1px solid var(--line);
          border-radius: 8px; padding: 0.55rem 0.75rem;
          display: flex; flex-direction: column; gap: 0.15rem;
          transition: border-color 0.2s, background 0.2s;
        }
        .insight-card:hover { background: rgba(255,255,255,0.05); }
        .insight-card.gold  { border-color: rgba(255,184,28,0.25);  background: rgba(255,184,28,0.04); }
        .insight-card.green { border-color: rgba(34,197,94,0.25);   background: rgba(34,197,94,0.04); }
        .insight-card.red   { border-color: rgba(200,16,46,0.25);   background: rgba(200,16,46,0.04); }
        .insight-card.blue  { border-color: rgba(125,180,255,0.25); background: rgba(125,180,255,0.04); }
        .insight-card.gold:hover  { background: rgba(255,184,28,0.07); }
        .insight-card.green:hover { background: rgba(34,197,94,0.07); }
        .insight-card.red:hover   { background: rgba(200,16,46,0.07); }
        .insight-card.blue:hover  { background: rgba(125,180,255,0.07); }
        /* First card (leader/race) gets a larger, more prominent treatment */
        .insights .insight-card:first-child {
          grid-column: 1 / -1;
          flex-direction: row; align-items: center; gap: 1rem;
          padding: 0.7rem 1rem;
          border-color: rgba(255,184,28,0.35);
          background: rgba(255,184,28,0.05);
          box-shadow: 0 0 24px rgba(255,184,28,0.05);
        }
        .insights .insight-card:first-child:hover { background: rgba(255,184,28,0.09); }
        .insights .insight-card:first-child .insight-icon { font-size: 1.4rem; flex-shrink: 0; }
        .insights .insight-card:first-child .insight-main { font-size: 1.1rem; }
        .insights .insight-card:first-child .insight-sub { margin-left: auto; text-align: right; flex-shrink: 0; }
        @media (max-width: 600px) {
          .insights { gap: 0.4rem; margin-bottom: 1rem; }
          .insights .insight-card:first-child {
            flex-direction: row; padding: 0.5rem 0.65rem; gap: 0.6rem;
          }
          .insights .insight-card:first-child .insight-icon { font-size: 1.1rem; }
          .insights .insight-card:first-child .insight-main { font-size: 0.95rem; }
          .insights .insight-card:first-child .insight-sub { font-size: 0.72rem; }
          .insight-card { padding: 0.4rem 0.6rem; border-radius: 6px; }
        }
        .insight-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.35); }
        @media (max-width: 600px) { .insight-label { font-size: 0.62rem; letter-spacing: 1px; } }
        .insight-icon { font-size: 0.9rem; line-height: 1; margin-bottom: 0.05rem; }
        .insight-main { font-family: 'Bebas Neue', cursive; font-size: 0.95rem; letter-spacing: 1.5px; color: white; line-height: 1.2; }
        @media (max-width: 600px) { .insight-main { font-size: 0.88rem; } }
        .insight-main.gold  { color: var(--gold); }
        .insight-main.green { color: var(--green); }
        .insight-main.red   { color: #ff5050; }
        .insight-main.blue  { color: var(--blue); }
        .insight-sub { font-size: 0.78rem; font-weight: 600; color: var(--silver); }
        @media (max-width: 600px) { .insight-sub { font-size: 0.7rem; } }

        /* Insights page */
        .insights-page-header { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.9rem; margin-top: 0.25rem; }
        .insights-page-title { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; letter-spacing: 2px; color: white; }
        .insights-page-sub { font-size: 0.75rem; color: rgba(255,255,255,0.35); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .insights-full { margin-bottom: 2rem; }
        .insights-full .insight-card:first-child { grid-column: 1 / -1; }

        /* ── TEAM TABS ── */
        /* ── DRILL-DOWN NAVIGATION ── */
        .standings-nav {
          position: relative; overflow: hidden;
        }
        .standings-layer {
          width: 100%;
          transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.32s ease;
          will-change: transform;
        }
        .standings-layer.dragging {
          transition: none;
        }
        .standings-layer.behind {
          position: absolute; top: 0; left: 0;
          transform: translateX(-30%); opacity: 0; pointer-events: none;
        }
        .standings-layer.front {
          transform: translateX(0); opacity: 1;
        }
        .detail-back-btn {
          display: inline-flex; align-items: center; gap: 6px;
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem;
          font-weight: 700; letter-spacing: 0.5px; color: var(--gold);
          background: none; border: none; cursor: pointer; padding: 0;
          margin-bottom: 1rem; opacity: 0.85;
        }
        .detail-back-btn:hover { opacity: 1; }
        .detail-back-btn svg { width: 16px; height: 16px; }

        .team-tabs {
          display: flex; flex-wrap: nowrap; gap: 6px; margin-bottom: 1.25rem;
          overflow-x: auto; -webkit-overflow-scrolling: touch;
          scrollbar-width: none; /* Firefox */
          padding-bottom: 2px; /* prevent clipping shadow */
        }
        .team-tabs::-webkit-scrollbar { display: none; }
        .team-tab {
          font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px;
          background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
          color: var(--silver); border-radius: 7px; padding: 8px 16px;
          cursor: pointer; flex-shrink: 0; white-space: nowrap;
          transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .team-tab:hover { background: rgba(255,255,255,0.08); color: white; }
        .team-tab.active { background: rgba(255,184,28,0.1); border-color: rgba(255,184,28,0.4); color: var(--gold); }
        .team-tab-pts { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.35); margin-left: 4px; }
        .team-tab.active .team-tab-pts { color: rgba(255,184,28,0.6); }
        @media (min-width: 861px) { .team-tab { font-size: 1rem; padding: 7px 20px; } }

        /* ── DETAIL ── */
        .detail-header {
          display: flex; align-items: flex-start; justify-content: space-between;
          margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;
        }
        .detail-header-left { display: flex; flex-direction: column; gap: 0.3rem; }
        .detail-title { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; letter-spacing: 3px; color: white; }
        @media (min-width: 861px) { .detail-title { font-size: 1.9rem; } }
        .detail-rank-label { font-size: 0.8rem; font-weight: 700; color: var(--silver); letter-spacing: 1px; }
        .detail-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
        .detail-summary { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        .detail-badge { font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; padding: 2px 10px; border-radius: 4px; }
        .detail-badge.pts    { background: rgba(255,184,28,0.12); color: var(--gold); border: 1px solid rgba(255,184,28,0.3); }
        .detail-badge.cap    { background: rgba(255,255,255,0.06); color: var(--silver); border: 1px solid rgba(255,255,255,0.1); }

        /* ── POS SCORES BAR ── */

        @media (max-width: 480px) { .pos-scores-bar { flex-wrap: wrap; } }
        .pos-score-block {

          padding: 0.6rem 0.75rem; text-align: center;
          position: relative; overflow: hidden;
        }
        .pos-score-block.F { border-color: rgba(255,122,138,0.2); }
        .pos-score-block.D { border-color: rgba(125,180,255,0.2); }
        .pos-score-block.G { border-color: rgba(255,184,28,0.2); }
        .pos-score-block.B { border-color: rgba(255,255,255,0.12); }

        .pos-score-val {

        @media (min-width: 861px) { .pos-score-val { font-size: 2rem; } }
        .pos-score-block.F .pos-score-val { color: var(--pink); }
        .pos-score-block.D .pos-score-val { color: var(--blue); }
        .pos-score-block.G .pos-score-val { color: var(--gold); }

        .pos-score-label { font-size: 0.72rem; font-weight: 700; color: var(--silver); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
        .pos-rank-badge {
          display: inline-flex; align-items: center; gap: 2px; margin-top: 5px;
          font-family: 'Bebas Neue', cursive; font-size: 0.7rem; letter-spacing: 1px;
          border-radius: 3px; padding: 1px 6px; line-height: 1.4;
        }
        .pos-rank-badge.r1    { color: var(--gold);            background: rgba(255,184,28,0.15);   border: 1px solid rgba(255,184,28,0.3);   }
        .pos-rank-badge.r2    { color: #c0c8d4;                background: rgba(192,200,212,0.1);   border: 1px solid rgba(192,200,212,0.2);  }
        .pos-rank-badge.r3    { color: #cd7f32;                background: rgba(205,127,50,0.1);    border: 1px solid rgba(205,127,50,0.2);   }
        .pos-rank-badge.rmid  { color: rgba(255,255,255,0.4);  background: rgba(255,255,255,0.04);  border: 1px solid rgba(255,255,255,0.08); }
        .pos-rank-badge.rlast { color: rgba(255,80,80,0.6);    background: rgba(255,80,80,0.05);    border: 1px solid rgba(255,80,80,0.15);   }

        /* ── HIST TABLE ── */
        .hist-table { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; }

        /*
         * Grid cols: pos-badge | name | stat1 | stat2 | [stat3 — hidden] | pts
         */
        .hist-header-row,
        .hist-row {
          display: grid;
          grid-template-columns: 28px 1fr 40px 40px 40px 48px 52px 60px;
          gap: 0.4rem; padding: 0.45rem 0.75rem; align-items: center;
        }
        @media (max-width: 560px) {
          .hist-header-row,
          .hist-row { grid-template-columns: 22px 1fr 28px 38px 44px 44px; gap: 0.2rem; padding: 0.45rem 0.4rem; }
          .hist-col-hide-g, .hist-col-hide, .hist-ppg-hide-g { display: none; }
          /* Goalie table mobile: pos | name | GP | Pts | PPG | Ytd */
          .hist-table-g .hist-header-row,
          .hist-table-g .hist-row { grid-template-columns: 22px 1fr 28px 44px 44px 44px; }
          .hist-g-hide-mobile { display: none; }
          .hist-g-show-mobile { display: revert; }
        }
        @media (min-width: 561px) {
          .hist-g-show-mobile { display: none; }
        }
        .hist-ytd { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 1px; text-align: right; }
        .hist-ytd.pos { color: var(--green); }
        .hist-ytd.zero { color: rgba(255,255,255,0.15); }
        .hist-header-row { background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0.35rem 0.75rem; }
        .hist-row { border-bottom: 1px solid rgba(255,255,255,0.04); }
        .hist-row:last-child { border-bottom: none; }
        .hist-row.past    { opacity: 0.45; }
        .hist-row.current { background: rgba(34,197,94,0.04); }
        .hist-row.total   { background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.1); opacity: 1; }
        .hist-pos { font-family: 'Bebas Neue', cursive; font-size: 0.7rem; letter-spacing: 1px; border-radius: 3px; padding: 1px 5px; text-align: center; }
        .hist-pos.F { background: rgba(255,122,138,0.15); color: var(--pink); }
        .hist-pos.D { background: rgba(125,180,255,0.15); color: var(--blue); }
        .hist-pos.G { background: rgba(255,184,28,0.15);  color: var(--gold); }
        .hist-pos.B { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }
        .hist-name { font-size: 0.9rem; font-weight: 700; color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 0.4rem; cursor: default; min-width: 0; }
        .hist-name.past { color: var(--silver); text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.2); }
        .hist-name img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
        .hist-stat { font-size: 0.85rem; font-weight: 700; color: var(--silver); text-align: right; }
        .hist-pts { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 1px; color: var(--gold); text-align: right; }
        .hist-pts.total { color: white; font-size: 1.1rem; }


        /* ── PLAYER MODAL ── */
        .player-popup-overlay {
          position: fixed; inset: 0; z-index: 999;
          background: rgba(0,0,0,0.6); display: flex; align-items: flex-end;
          justify-content: center; padding: 0 0 env(safe-area-inset-bottom,0);
          backdrop-filter: blur(4px);
        }

        .player-popup {
          background: #111827; border: 1px solid rgba(255,255,255,0.12);

        .pm-header {

          width: 64px; height: 64px; border-radius: 50%;

        .pm-logo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
        .pm-logo-placeholder { width: 48px; height: 48px; flex-shrink: 0; }
        .pm-header-info { flex: 1; min-width: 0; }
        .pm-name {
          font-family: 'Bebas Neue', cursive; font-size: 1.35rem;
          letter-spacing: 2px; color: white; line-height: 1.1;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pm-meta { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.3rem; flex-wrap: wrap; }
        .pm-pos-badge {
          font-family: 'Bebas Neue', cursive; font-size: 0.7rem; letter-spacing: 1px;
          border-radius: 3px; padding: 1px 7px;
        }
        .pm-pos-badge.F { background: rgba(255,122,138,0.15); color: var(--pink); }
        .pm-pos-badge.D { background: rgba(125,180,255,0.15); color: var(--blue); }
        .pm-pos-badge.G { background: rgba(255,184,28,0.15); color: var(--gold); }
        .pm-team-name { font-size: 0.8rem; font-weight: 700; color: var(--silver); letter-spacing: 0.5px; }
        .pm-owner-badge {
          font-size: 0.72rem; font-weight: 700; border-radius: 3px; padding: 1px 7px;
        }
        .pm-tenure { font-size: 0.72rem; color: rgba(255,255,255,0.3); letter-spacing: 0.5px; margin-top: 0.15rem; }
        .pm-close {
          position: absolute; top: 0.85rem; right: 0.85rem;
          width: 28px; height: 28px; border-radius: 50%;
          background: rgba(255,255,255,0.07); border: none; color: var(--silver);
          font-size: 1rem; line-height: 1; cursor: pointer; display: flex;
          align-items: center; justify-content: center;
          transition: background 0.15s, color 0.15s;
        }
        .pm-close:hover { background: rgba(255,255,255,0.14); color: white; }
        .pm-pts-header {
          display: flex; flex-direction: column; align-items: flex-end;
          margin-left: auto; margin-right: 2.2rem; flex-shrink: 0;
        }
        .pm-pts-header-val {
          font-family: 'Bebas Neue', cursive; font-size: 2rem; letter-spacing: 2px;
          color: var(--gold); line-height: 1;
        }
        .pm-pts-header-label {
          font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px;
          color: rgba(255,255,255,0.35); text-transform: uppercase; margin-top: 1px;
        }

        .pm-stats {
          display: grid; gap: 1px; padding: 0.85rem 1.1rem;
          border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .pm-stats-row { display: flex; gap: 0.5rem; }
        .pm-stat-block {
          flex: 1; background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.07); border-radius: 8px;
          padding: 0.5rem 0.6rem; text-align: center;
        }
        .pm-stat-val {
          font-family: 'Bebas Neue', cursive; font-size: 1.5rem;
          letter-spacing: 1px; line-height: 1; color: white;
        }
        .pm-stat-val.gold { color: var(--gold); }
        .pm-stat-val.green { color: var(--green); }
        .pm-stat-val.pink { color: var(--pink); }
        .pm-stat-val.blue { color: var(--blue); }
        .pm-stat-label {
          font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px;
          text-transform: uppercase; color: rgba(255,255,255,0.3); margin-top: 2px;
        }
        .pm-stat-block.highlight {
          border-color: rgba(255,184,28,0.3);
          background: rgba(255,184,28,0.05);
        }

        .pm-extra {
          display: flex; gap: 0.5rem; padding: 0.75rem 1.1rem;
          border-bottom: 1px solid rgba(255,255,255,0.07); flex-wrap: wrap;
        }
        .pm-chip {
          font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;
          background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
          border-radius: 5px; padding: 3px 10px; color: var(--silver);
          display: flex; align-items: center; gap: 0.3rem;
        }
        .pm-chip.ytd { border-color: rgba(34,197,94,0.3); color: var(--green); background: rgba(34,197,94,0.07); }
        .pm-chip.cap { border-color: rgba(255,255,255,0.1); }
        .pm-chip.playing { border-color: rgba(255,184,28,0.3); color: var(--gold); background: rgba(255,184,28,0.07); }
        .pm-chip.past-player { border-color: rgba(255,80,80,0.2); color: rgba(255,80,80,0.6); background: rgba(255,80,80,0.05); }

        .pm-actions { display: flex; gap: 0.6rem; padding: 0.85rem 1.1rem; }
        .pm-btn {
          flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
          padding: 0.7rem 1rem; border-radius: 9px;
          font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 700;
          letter-spacing: 1px; text-decoration: none; cursor: pointer;
          border: 1px solid rgba(255,255,255,0.12); color: white;
          background: rgba(255,255,255,0.05); transition: background 0.15s;

        .pm-btn:hover { background: rgba(255,255,255,0.1); }

        .pm-btn.nhl:hover { background: rgba(0,102,204,0.22); }
        .pm-btn.cancel { color: rgba(255,255,255,0.4); }

        .hist-section-label { font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 3px; padding: 0.3rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .hist-section-label.F { color: var(--pink); background: rgba(255,122,138,0.04); }
        .hist-section-label.D { color: var(--blue); background: rgba(125,180,255,0.04); }
        .hist-section-label.G { color: var(--gold); background: rgba(255,184,28,0.04); }
        .swap-history { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; }
        .swap-row { padding: 0.65rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.04); }

        .swap-date { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 1px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 0.25rem; }
        .swap-move { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; font-weight: 700; }

        .swap-out { color: rgba(255,80,80,0.8); }
        .swap-arrow { color: rgba(255,255,255,0.25); font-size: 1rem; }
        .swap-note { font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-top: 0.2rem; }
        .swap-reason { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px; margin-left: 4px; text-transform: uppercase; }

        .swap-reason.tactical { background: rgba(125,180,255,0.1); color: var(--blue); border: 1px solid rgba(125,180,255,0.2); }
        .swap-date-chip { display: block; font-size: 0.65rem; color: rgba(255,255,255,0.3); letter-spacing: 0.3px; margin-top: 1px; }

        /* ── BUMP CHART ── */
        .bump-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07); padding: 1rem 0.5rem 0.5rem; }
        .bump-svg { display: block; min-width: 300px; }
        .bump-empty { text-align: center; color: rgba(255,255,255,0.25); font-size: 0.85rem; letter-spacing: 1px; padding: 3rem 0; }

        /* ── WEEKLY REVIEW ── */
        .week-review { margin-bottom: 1.75rem; }
        .week-review-title { font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 3px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 0.6rem; }
        .week-review-rows { display: flex; flex-direction: column; gap: 0.35rem; }

        .bump-toggle { display: flex; gap: 4px; margin-bottom: 1rem; }
        .bump-toggle-btn { font-family: 'Bebas Neue', cursive; font-size: 0.8rem; letter-spacing: 2px; padding: 4px 14px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--silver); cursor: pointer; transition: all 0.15s; }

        /* "Pt/GP" tooltip on column header */
        .col-tooltip-wrap { position: relative; display: inline-flex; align-items: center; gap: 3px; cursor: help; }
        .col-tooltip-wrap .col-tip {
          display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
          background: #0d1b2e; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;

<script>
    const SUPABASE_URL = 'https://fifurqlitkywtmhgtzeu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';
    const PW_PLAIN = 'parieur2026'; // kept for pool.html admin only — not used here
    const CACHE_KEY = 'hp_players_v11_' + new Date().toISOString().slice(0,10); // busts daily
    const CACHE_TTL_MS = 30 * 60 * 1000; // 30 min within a day
    const ACTIVE_ACQUIRED_FALLBACK_DATE = new Date('2025-09-01T00:00:00Z');

    // ── PAGE VIEW COUNTER ─────────────────────────────────────────────────────
    async function trackPageView() {
      const el = document.getElementById('view-count');
      const today = new Date().toISOString().slice(0, 10);
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_page_views`, {
          method: 'POST',
          headers: { ...sbHeaders(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ page_name: 'pool_standings', view_date: today }),
        });
        const res = await fetch(`${SUPABASE_URL}/rest/v1/page_views?page=eq.pool_standings&date=eq.${today}&select=views`, {
          headers: sbHeaders(),
        });
        if (res.ok) {
          const rows = await res.json();
          if (rows.length && el) {
            const n = rows[0].views;
            el.innerHTML = `👁 <span>${n.toLocaleString()}</span> today`;
          }
        }
      } catch (_) {}
    }
    trackPageView();

    function sbHeaders(extra = {}) {
      return {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        ...extra,
      };
    }

    const TEAM_ABBR = {
      'anaheim-ducks':'ANA','boston-bruins':'BOS','buffalo-sabres':'BUF','calgary-flames':'CGY',
      'carolina-hurricanes':'CAR','chicago-blackhawks':'CHI','colorado-avalanche':'COL',
      'columbus-blue-jackets':'CBJ','dallas-stars':'DAL','detroit-red-wings':'DET',
      'edmonton-oilers':'EDM','florida-panthers':'FLA','los-angeles-kings':'LAK',
      'minnesota-wild':'MIN','montreal-canadiens':'MTL','nashville-predators':'NSH',
      'new-jersey-devils':'NJD','new-york-islanders':'NYI','new-york-rangers':'NYR',
      'ottawa-senators':'OTT','philadelphia-flyers':'PHI','pittsburgh-penguins':'PIT',
      'san-jose-sharks':'SJS','seattle-kraken':'SEA','st-louis-blues':'STL',
      'tampa-bay-lightning':'TBL','toronto-maple-leafs':'TOR','utah-hockey-club':'UTA',
      'vancouver-canucks':'VAN','vegas-golden-knights':'VGK','washington-capitals':'WSH','winnipeg-jets':'WPG',
    };

    // ── MOBILE NAV ───────────────────────────────────────────────────────────────

    // ── STATE ────────────────────────────────────────────────────────────────────
    const _leagueCode = new URLSearchParams(window.location.search).get('league') || null;
    if (!_leagueCode) window.location.replace('/pool');
    let _leagueName = null;

    let allPlayers = [], teams = [], currentTrades = [], activeTeamId = null, _benchSwaps = [];
    let _lastSnapshot = {}; // team_id -> { pts, rank } from most recent daily snapshot
    let _yesterdaySnapshot = {}; // team_id -> pts from previous day's snapshot
    let _playerYesterdayPtsBySlug = {}; // slug -> pool pts delta since yesterday
    let _playerYesterdayPts = {}; // nhl_player_id -> pool pts scored yesterday
    let teamsPlayingToday = new Set(); // NHL team abbrevs with a game today
    let tonightMatchups = {};          // abbrev → opponent abbrev

    function yesterdayIsoDay() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    }

    async function loadYesterdayPts() {
      try {
        const res = await fetch('/data/player_yesterday_pts.json');
        if (!res.ok) return;
        const json = await res.json();
        const pts = json.pts || {};
        for (const [id, p] of Object.entries(pts)) {
          _playerYesterdayPts[Number(id)] = p;
        }
        render();
      } catch(_) {}
    }
    let _windowPtsByTradeKey = {};
    const _gameLogCache = new Map();

    // ── Live scoring ──────────────────────────────────────────────────────────
    const NHL_PROXY = '/api/nhl-schedule';
    let _livePts = {};        // nhl_player_id (number) → live pool pts tonight
    let _liveGames = [];      // [{ id, away, home }]
    let _liveTimer = null;
    let _liveActive = false;
    let _anyGameLive = false; // true when at least one game is in progress

    function isGameHour() {
      const h = new Date().toLocaleString('en-CA', { timeZone: 'America/Toronto', hour: 'numeric', hour12: false });
      const n = Number(h);
      return n >= 17 && n < 24; // 5pm–midnight Montreal
    }

    function liveTeamPts(team) {
      let total = 0;
      const rp = rosterPlayers(team.roster);
      [...rp.F, ...rp.D, ...rp.G].filter(Boolean).forEach(p => {
        if (p.nhl_player_id) total += (_livePts[p.nhl_player_id] ?? 0);
      });
      return total;
    }
    function liveSubPts(team) {
      const out = { F: 0, D: 0, G: 0 };
      const rp = rosterPlayers(team.roster);
      const add = (arr, pos) => arr.filter(Boolean).forEach(p => { if (p.nhl_player_id) out[pos] += (_livePts[p.nhl_player_id] ?? 0); });
      add(rp.F, 'F'); add(rp.D, 'D'); add(rp.G, 'G');
      return out;
    }

    async function pollLive() {
      if (!_liveGames.length) return;
      const newPts = {};
      let anyLive = false;
      await Promise.all(_liveGames.map(async ({ id }) => {
        try {
          const res = await fetch(`${NHL_PROXY}?path=/v1/gamecenter/${id}/boxscore`);
          if (!res.ok) return;
          const data = await res.json();
          const gs = data.gameState;
          if (gs === 'FUT' || gs === 'PRE') return;
          if (gs === 'LIVE' || gs === 'CRIT') anyLive = true;
          const isOver = gs === 'OFF';
          const isOT = (data.gameOutcome?.lastPeriodType === 'OT') || (data.gameOutcome?.lastPeriodType === 'SO');
          const ps = data.playerByGameStats || {};
          for (const side of ['awayTeam', 'homeTeam']) {
            const sideData = ps[side] || {};
            for (const group of ['forwards', 'defense']) {
              for (const p of (sideData[group] || [])) {
                const id = p.playerId;
                if (!id) continue;
                const pos = group === 'defense' ? 'D' : 'F';
                let pts;
                if (pos === 'D') pts = (p.goals || 0) * _scoring.d_goals + (p.assists || 0) * _scoring.d_assists;
                else pts = (p.points || 0) * _scoring.f_points;
                if (pts > 0) newPts[id] = (newPts[id] || 0) + pts;
              }
            }
            for (const g of (sideData.goalies || [])) {
              const id = g.playerId;
              if (!id || !g.toi || g.toi === '00:00') continue;
              const decision = (g.decision || '').toUpperCase();
              let pts = 0;
              if (decision === 'W') pts += _scoring.g_wins;
              if (isOver && isOT && decision === 'L') pts += _scoring.g_otl;
              if (isOver && g.goalsAgainst === 0 && decision === 'W') pts += _scoring.g_shutouts;
              if (pts > 0) newPts[id] = (newPts[id] || 0) + pts;
            }
          }
        } catch(_) {}
      }));
      const ptsChanged = JSON.stringify(newPts) !== JSON.stringify(_livePts);
      const liveChanged = anyLive !== _anyGameLive;
      _livePts = newPts;
      _anyGameLive = anyLive;
      if (ptsChanged || liveChanged) { clearCache(); render(); }
    }

    function startLivePolling() {
      if (!isGameHour() || !_liveGames.length) return;
      _liveActive = true;
      pollLive();
      _liveTimer = setInterval(() => {
        if (!isGameHour()) { stopLivePolling(); return; }
        pollLive();
      }, 60000);
    }

    function stopLivePolling() {
      _liveActive = false;
      if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
    }
    // ─────────────────────────────────────────────────────────────────────────
    let activeView = sessionStorage.getItem('pool_view') || 'standings';
    // Sort state for roster tables: { pos: 'F'|'D'|'G', field: 'pts'|'gp'|'g'|'a'|'w'|'so' }
    let _rosterSort = {}; // keyed by pos
    if (activeView === 'allteams' || activeView === 'team') activeView = 'standings';
    // Restore last-selected team (null = show leaderboard only)
    if (activeView === 'standings') {
      const savedTeam = sessionStorage.getItem('pool_team');
      if (savedTeam) activeTeamId = savedTeam;
    }

    let _cache = {};
    function clearCache() { _cache = {}; }

    function slugMap() {
      if (!_cache.slugMap) {
        _cache.slugMap = Object.fromEntries(allPlayers.map(p => [p.puckpedia_slug, p]));
      }
      return _cache.slugMap;
    }

    function teamTotalPts(team) {
      if (!_cache.teamPts) _cache.teamPts = {};
      if (_cache.teamPts[team.id] !== undefined) return _cache.teamPts[team.id];
      const s = teamSubScores(team);
      _cache.teamPts[team.id] = s.F + s.D + s.G + s.B + liveTeamPts(team);
      return _cache.teamPts[team.id];
    }
    function sortedTeams() {
      if (!_cache.sorted) _cache.sorted = [...teams].sort((a, b) => teamTotalPts(b) - teamTotalPts(a));
      return _cache.sorted;
    }
    function setRosterSort(pos, field) {
      _rosterSort[pos] = field;
      render();
    }
    function allDraftedPlayers() {
      if (!_cache.drafted) {
        const list = [];
        teams.forEach(t => {
          const r = rosterPlayers(t.roster);
          ['F','D','G'].forEach(pos => r[pos].filter(Boolean).forEach(p => list.push({ player:p, owner:t.name, pos, team:t })));
        });
        _cache.drafted = list;
      }
      return _cache.drafted;
    }

    // ── SCORING ──────────────────────────────────────────────────────────────────
    let _scoring = { f_points:1, d_goals:2, d_assists:1, g_wins:2, g_shutouts:3, g_otl:1 };
    async function loadScoringSettings() {
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/pool_settings?league_code=eq.${_leagueCode}&select=f_points,d_goals,d_assists,g_wins,g_shutouts,g_otl`,
          { headers: sbHeaders() });
        if (r.ok) { const rows = await r.json(); if (rows.length) _scoring = { ..._scoring, ...rows[0] }; }
      } catch(e) {}
    }

    function normalizePos(pos) {
      if (!pos) return 'F';
      const p = pos.toUpperCase();
      if (p.includes('G')) return 'G';
      if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
      return 'F';
    }

    function poolScore(p) {
      const pos = normalizePos(p.position);
      if (pos === 'G') return (p.wins ?? 0) * _scoring.g_wins + (p.shutouts ?? 0) * _scoring.g_shutouts + (p.ot_losses ?? 0) * _scoring.g_otl;
      if (pos === 'D') return (p.goals ?? 0) * _scoring.d_goals + (p.assists ?? 0) * _scoring.d_assists;
      return (p.points ?? 0) * _scoring.f_points;
    }

    function toIsoDay(v) {
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return null;
      return d.toISOString().slice(0, 10);
    }
    function seasonFromDate(v) {
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return null;
      const y = d.getUTCFullYear();
      const m = d.getUTCMonth() + 1;
      const startY = m >= 7 ? y : y - 1;
      return `${startY}${startY + 1}`;
    }
    function seasonsForRange(startDate, endDate) {
      const s1 = seasonFromDate(startDate);
      const s2 = seasonFromDate(endDate);
      if (!s1 && !s2) return [];
      if (!s1) return [s2];
      if (!s2 || s1 === s2) return [s1];
      return [s1, s2];
    }
    function scoreGameForPool(game, pos) {
      if (pos === 'G') {
        const win = String(game?.decision || '').toUpperCase() === 'W' ? 1 : 0;
        const shutouts = Number(game?.shutouts ?? 0) || 0;
        const otl = String(game?.decision || '').toUpperCase() === 'L' && game?.otLoss ? 1 : 0;
        return win * _scoring.g_wins + shutouts * _scoring.g_shutouts + otl * _scoring.g_otl;
      }
      if (pos === 'D') {
        const g = Number(game?.goals ?? 0) || 0;
        const a = Number(game?.assists ?? 0) || 0;
        return g * _scoring.d_goals + a * _scoring.d_assists;
      }
      const pts = Number(game?.points ?? (Number(game?.goals ?? 0) || 0) + (Number(game?.assists ?? 0) || 0)) || 0;
      return pts * _scoring.f_points;
    }
    function gameDateStr(game) {
      return game?.gameDate || game?.gameDateUTC || game?.date || game?.game?.gameDate || game?.game?.date || null;
    }
    async function fetchPlayerGameLog(playerId, season) {
      const key = `${playerId}:${season}`;
      if (_gameLogCache.has(key)) return _gameLogCache.get(key);
      const url = `https://api-web.nhle.com/v1/player/${playerId}/game-log/${season}/2`;
      const p = fetch(url)
        .then(r => r.ok ? r.json() : { games: [] })
        .then(data => {
          if (Array.isArray(data?.games)) return data.games;
          if (Array.isArray(data?.gameLog)) return data.gameLog;
          return [];
        })
        .catch(() => []);
      _gameLogCache.set(key, p);
      return p;
    }
    async function computeWindowPointsForPlayer(playerId, pos, startDate, endDate) {
      const startDay = toIsoDay(startDate);
      const endDay = toIsoDay(endDate);
      if (!playerId || !startDay || !endDay) return null;
      const seasons = seasonsForRange(startDate, endDate);
      if (!seasons.length) return null;
      let total = 0;
      for (const season of seasons) {
        const games = await fetchPlayerGameLog(playerId, season);
        games.forEach(g => {
          const gDay = toIsoDay(gameDateStr(g));
          if (!gDay) return;
          if (gDay >= startDay && gDay <= endDay) total += scoreGameForPool(g, pos);
        });
      }
      return total;
    }
    function tradeWindowKey(trade, isCurrent = false) {
      const endMarker = isCurrent ? 'NOW' : (trade?.date_traded || '');
      return [trade?.team_id || '', trade?.player_to_slug || '', trade?.date_from_acquired || '', endMarker].join('|');
    }
    function teamHasPlayerSlug(team, slug) {
      if (!team || !slug) return false;
      return [...(team.roster?.F || []), ...(team.roster?.D || []), ...(team.roster?.G || []), ...(team.roster?.B || [])].includes(slug);
    }
    function latestIncomingTrade(teamId, slug) {
      if (!teamId || !slug || !Array.isArray(currentTrades)) return null;
      for (let i = currentTrades.length - 1; i >= 0; i--) {
        const t = currentTrades[i];
        if (t?.team_id === teamId && t?.player_to_slug === slug && t?.date_from_acquired) return t;
      }
      return null;
    }
    async function runWithConcurrency(items, worker, limit = 6) {
      if (!items.length) return;
      let i = 0;
      async function runner() {
        while (i < items.length) {
          const idx = i++;
          await worker(items[idx], idx);
        }
      }
      const count = Math.min(limit, items.length);
      await Promise.all(Array.from({ length: count }, () => runner()));
    }
    async function precomputeTradeWindowPoints() {
      if (!Array.isArray(currentTrades) || !currentTrades.length) return;
      const activeByTeamSlug = new Set();
      teams.forEach(t => {
        [...(t.roster.F || []), ...(t.roster.D || []), ...(t.roster.G || []), ...(t.roster.B || [])]
          .filter(Boolean)
          .forEach(slug => activeByTeamSlug.add(`${t.id}|${slug}`));
      });
      const candidates = currentTrades.filter(t => {
        if (!t?.team_id || !t?.player_to_slug || !t?.date_from_acquired) return false;
        const isCurrent = activeByTeamSlug.has(`${t.team_id}|${t.player_to_slug}`);
        if (isCurrent) return true;
        return !!t?.date_traded;
      });
      let changed = false;
      await runWithConcurrency(candidates, async (trade) => {
        const isCurrent = activeByTeamSlug.has(`${trade.team_id}|${trade.player_to_slug}`);
        const key = tradeWindowKey(trade, isCurrent);
        if (_windowPtsByTradeKey[key] !== undefined) return;
        const p = slugMap()[trade.player_to_slug];
        const playerId = p?.nhl_player_id;
        const pos = normalizePos(p?.position || trade?.player_to_position);
        if (!playerId || !pos) return;
        const endDate = isCurrent ? new Date().toISOString() : trade.date_traded;
        const pts = await computeWindowPointsForPlayer(playerId, pos, trade.date_from_acquired, endDate);
        if (typeof pts === 'number' && Number.isFinite(pts)) {
          _windowPtsByTradeKey[key] = pts;
          changed = true;
        }
      }, 6);
      if (changed) render();
    }

    /*
     * FIX 7: poolScoreOwned and ownedStatsDelta are now symmetric.
     * Both treat "no acquisition entry" (original draft pick) identically —
     * they use the full-season stats with a zero snapshot, so the delta
     * equals the full season stats. This means GP/G/A always display
     * in the hist table for draft picks, consistent with how points are counted.
     */
    function _zeroSnapshot() {
      return { points: 0, goals: 0, assists: 0, wins: 0, shutouts: 0, ot_losses: 0, games_played: 0 };
    }
    function _resolveSnapshot(team, slug) {
      const acq = team?.acquisitions?.[slug];
      if (acq === undefined) return { snapshot: _zeroSnapshot(), frozen: 0 };  // draft pick → full season
      return { snapshot: acq?.stats_snapshot || _zeroSnapshot(), frozen: acq?.frozen_points ?? 0 };
    }

    function poolScoreOwned(p, team, slug) {
      const { snapshot: s, frozen } = _resolveSnapshot(team, slug);
      const pos = normalizePos(p.position);
      let delta;
      if (pos === 'G') {
        const wins = Math.max(0, (p.wins ?? 0) - (s.wins ?? 0));
        const so   = Math.max(0, (p.shutouts ?? 0) - (s.shutouts ?? 0));
        const otl  = Math.max(0, (p.ot_losses ?? 0) - (s.ot_losses ?? 0));
        delta = wins * _scoring.g_wins + so * _scoring.g_shutouts + otl * _scoring.g_otl;
      } else if (pos === 'D') {
        const g = Math.max(0, (p.goals ?? 0) - (s.goals ?? 0));
        const a = Math.max(0, (p.assists ?? 0) - (s.assists ?? 0));
        delta = g * _scoring.d_goals + a * _scoring.d_assists;
      } else {
        delta = Math.max(0, ((p.points ?? 0) - (s.points ?? 0))) * _scoring.f_points;
      }
      return frozen + delta;
    }

    function ownedStatsDelta(p, team, slug) {
      const { snapshot: s } = _resolveSnapshot(team, slug);
      return {
        pos:         normalizePos(p.position),
        goals:       Math.max(0, (p.goals ?? 0)        - (s.goals ?? 0)),
        assists:     Math.max(0, (p.assists ?? 0)      - (s.assists ?? 0)),
        points:      Math.max(0, (p.points ?? 0)       - (s.points ?? 0)),
        wins:        Math.max(0, (p.wins ?? 0)         - (s.wins ?? 0)),
        shutouts:    Math.max(0, (p.shutouts ?? 0)     - (s.shutouts ?? 0)),
        otLosses:    Math.max(0, (p.ot_losses ?? 0)    - (s.ot_losses ?? 0)),
        gamesPlayed: Math.max(0, (p.games_played ?? 0) - (s.games_played ?? 0)),
      };
    }

    function ownedStatsLabel(p, team, slug) {
      const d = ownedStatsDelta(p, team, slug);
      if (d.pos === 'G') return `${d.gamesPlayed}GP · ${d.wins}W · ${d.shutouts}SO`;
      return `${d.gamesPlayed}GP · ${d.goals}G · ${d.assists}A`;
    }

    // Keep old name as alias so any remaining inline callers still work
    function showPlayerLinks(nhlId, slug) {

    function rosterPlayers(rs) {
      const m = slugMap();
      const resolve = s => (s && m[s]) ? { ...m[s], _slug: s } : null;
      return {
        F: (rs.F || []).map(resolve), D: (rs.D || []).map(resolve),
        G: (rs.G || []).map(resolve), B: (rs.B || []).map(resolve),

    function resolveActiveAcquiredDate(team, slug) {
      const acqRaw = team?.acquisitions?.[slug];
      const acqDate = (typeof acqRaw === 'object' && acqRaw?.date) ? new Date(acqRaw.date) : null;
      return (acqDate && !Number.isNaN(acqDate.getTime())) ? acqDate : ACTIVE_ACQUIRED_FALLBACK_DATE;

    function teamColor(name) {
      if (!teamColor._cache) teamColor._cache = {};
      if (teamColor._cache[name]) return teamColor._cache[name];
      const PALETTE = [
        { fg: '#60a5fa', bg: 'rgba(96,165,250,0.12)' },   // blue
        { fg: '#34d399', bg: 'rgba(52,211,153,0.12)' },   // green

    function teamSubScores(team) {
      if (!_cache.subScores) _cache.subScores = {};
      if (_cache.subScores[team.id]) return _cache.subScores[team.id];
      const r = rosterPlayers(team.roster);
      const sg = players => players.filter(Boolean).reduce((s, p) => s + poolScoreOwned(p, team, p._slug), 0);
      // Only count bench players who were officially swapped out (have a bench swap entry for this team)
      const swappedOutSlugs = new Set(_benchSwaps.filter(s => s.team_id === team.id).map(s => s.player_out_slug));
      const benchByPos = { F: 0, D: 0, G: 0 };
      (r.B || []).filter(Boolean).forEach(p => {
        if (!swappedOutSlugs.has(p._slug)) return;
        const pos = normalizePos(p.position);
        const pts = poolScoreOwned(p, team, p._slug);
        if (pos === 'D') benchByPos.D += pts;
        else if (pos === 'G') benchByPos.G += pts;
        else benchByPos.F += pts;
      });
      const benchTotal = benchByPos.F + benchByPos.D + benchByPos.G;
      const result = {
        F: sg(r.F), D: sg(r.D), G: sg(r.G),
        B: benchTotal, BF: benchByPos.F, BD: benchByPos.D, BG: benchByPos.G,
      };
      _cache.subScores[team.id] = result;
      return result;
    }
    function teamCapUsed(rs) {

      const rp = rosterPlayers(team.roster);

      const totalGP = dressed.reduce((s, p) => s + (ownedStatsDelta(p, team, p._slug)?.gamesPlayed ?? 0), 0);
      if (totalGP <= 0) return null;
      const pts = teamTotalPts(team);
      return (pts / totalGP).toFixed(2);

    function posRankForTeam(team, pos) {
      const posScore = t => { const s = teamSubScores(t); return pos === 'F' ? s.F + s.BF : pos === 'D' ? s.D + s.BD : pos === 'G' ? s.G + s.BG : s[pos] || 0; };
      const ranked = [...teams].map(t => ({ id: t.id, score: posScore(t) })).sort((a, b) => b.score - a.score);
      return ranked.findIndex(r => r.id === team.id) + 1;

    function posRankLabel(rank, total) {

      if (rank === 2) return { text: ordinal(rank), cls: 'r2' };
      if (rank === 3) return { text: ordinal(rank), cls: 'r3' };
      if (rank === total) return { text: `${ordinal(rank)} of ${total}`, cls: 'rlast' };
      return { text: `${ordinal(rank)} of ${total}`, cls: 'rmid' };
