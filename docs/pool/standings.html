        _benchSwaps = [];
        try {
          const swapRes = await fetch(`${SUPABASE_URL}/rest/v1/pool_bench_swaps?league_code=eq.${_leagueCode}&select=*&order=swap_date.asc`, { headers: sbHeaders() });
          if (swapRes.ok) _benchSwaps = await swapRes.json();
        } catch(_) {}
        // Load today's NHL schedule for opponent logos
        teamsPlayingToday = new Set();
        tonightMatchups = {};
        try {
          const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
          const schedRes = await fetch('/data/nhl_today.json');
          if (schedRes.ok) {
            const sched = await schedRes.json();
            if (sched.date === todayStr) {
              tonightMatchups = sched.matchups || {};
              for (const abbr of Object.keys(tonightMatchups)) teamsPlayingToday.add(abbr);
              _liveGames = (sched.games || []).filter(g => g.id);
            }
          }
        } catch(_) {}
        // Fetch latest 2 snapshots: most recent for rank changes, previous for yesterday delta
        try {
          const snapRes = await fetch(
            `${SUPABASE_URL}/rest/v1/pool_standings_snapshots?league_code=eq.${_leagueCode}&order=snapshot_date.desc&limit=2&select=snapshot_date,standings,player_pts`,
            { headers: sbHeaders() }
          );
          if (snapRes.ok) {
            const snapRows = await snapRes.json();
            if (snapRows.length && Array.isArray(snapRows[0].standings)) {
              _lastSnapshot = Object.fromEntries(snapRows[0].standings.map(s => [s.team_id, { pts: s.pts ?? 0, rank: s.rank ?? null }]));
            }
            // Use the previous day's snapshot for yesterday delta
            const prevSnap = snapRows.length >= 2 ? snapRows[1] : snapRows[0];
            const latestSnap = snapRows[0];
            if (prevSnap && Array.isArray(prevSnap.standings)) {
              _yesterdaySnapshot = Object.fromEntries(prevSnap.standings.map(s => [s.team_id, s.pts ?? 0]));
            }
            // Per-player yesterday delta: latest player_pts - previous player_pts
            const latestPlayerPts  = latestSnap?.player_pts  || {};
            const prevPlayerPts    = prevSnap?.player_pts    || {};
            if (Object.keys(latestPlayerPts).length) {
              for (const [slug, pts] of Object.entries(latestPlayerPts)) {
                const prev = prevPlayerPts[slug] ?? pts;
                const delta = pts - prev;
                if (delta > 0) _playerYesterdayPtsBySlug[slug] = delta;
              }
            }
          }
        } catch(_) {}
        if (!activeTeamId) activeTeamId = null; // start on leaderboard unless restored from session
        render();
        loadYesterdayPts(); // async — re-renders when done
        startLivePolling(); // async — polls boxscores during game hours
      } catch(e) {
        console.error('load() failed:', e);
        document.getElementById('content').innerHTML = `<div class="msg">Failed to load data (${e?.message||e}). <button class="btn-refresh" onclick="load()">Retry</button></div>`;
      }
    }

    // ── RENDER ────────────────────────────────────────────────────────────────────
    function render() {
      const scrollY = window.scrollY;
      const sorted = sortedTeams();
      const leaderPts = sorted.length ? teamTotalPts(sorted[0]) : 0;
      const activeTeam = teams.find(t => t.id === activeTeamId);
      document.getElementById('content').innerHTML = `
        <div class="view-tabs">
          <div class="view-tab ${activeView==='standings'?'active':''}" onclick="setView('standings')">Standings</div>
          <div class="view-tab ${activeView==='pool'?'active':''}"      onclick="setView('pool')">Leaders</div>
          <div class="view-tab ${activeView==='history'?'active':''}"   onclick="setView('history')">History</div>
          <div class="view-tab ${activeView==='insights'?'active':''}"  onclick="setView('insights')">Insights</div>
          ${_anyGameLive ? '<div class="live-indicator">LIVE</div>' : ''}
        </div>
        <div id="view-standings" style="display:${activeView==='standings'?'block':'none'}">
          <div class="standings-nav">
            <div class="standings-layer ${activeTeam ? 'behind' : 'front'}" id="layer-list">
              ${buildInsightsTeaser(sorted, leaderPts)}
              ${buildLeaderboard(sorted, leaderPts)}
            </div>
            ${activeTeam ? `<div class="standings-layer front" id="layer-detail">
              <button class="detail-back-btn" onclick="clearTeam()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Standings
              </button>
              <div class="team-tabs">
                ${sorted.map(t => `<div class="team-tab ${t.id===activeTeamId?'active':''}" onclick="selectTeam('${encodeURIComponent(t.id)}')">${t.name}<span class="team-tab-pts">${teamTotalPts(t)}pts</span></div>`).join('')}
              </div>
              <div class="team-detail">${buildDetail(activeTeam, sorted, leaderPts)}</div>
            </div>` : ''}
          </div>
        </div>
        <div id="view-pool"     style="display:${activeView==='pool'?'block':'none'}">${buildPoolLeaders()}</div>
        <div id="view-history"  style="display:${activeView==='history'?'block':'none'}"><div class="bump-empty" id="bump-loading">Loading history…</div></div>
        <div id="view-insights" style="display:${activeView==='insights'?'block':'none'}">${buildInsightsPage(sorted, leaderPts)}</div>
      `;
      window.scrollTo({ top: scrollY, behavior: 'instant' });
      if (activeView === 'history') loadHistory();
    }

    function setView(v) {
      activeView = v;
      sessionStorage.setItem('pool_view', v);
      render();
      if (v === 'history') loadHistory();
    }
    function selectTeam(id) {
      activeTeamId = decodeURIComponent(id);
      activeView = 'standings';
      sessionStorage.setItem('pool_view', 'standings');
      sessionStorage.setItem('pool_team', activeTeamId);
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
      // Scroll team tab strip to active tab
      requestAnimationFrame(() => {
        const el = document.querySelector('.team-tab.active');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
    }
    function clearTeam() {
      activeTeamId = null;
      sessionStorage.removeItem('pool_team');
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // ── SWIPE BACK GESTURE (interactive drag) ────────────────────────────────
    (function initSwipeBack() {
      let startX = 0, startY = 0, lastX = 0, lastT = 0;
      let dragging = false, locked = false;

      function getLayers() {
        return {
          front: document.getElementById('layer-detail'),
          behind: document.getElementById('layer-list'),
        };
      }

      function setDrag(front, behind, dx) {
        const w = window.innerWidth;
        const progress = Math.min(1, Math.max(0, dx / w));
        // detail slides right (0 → 100%)
        front.style.transform = `translateX(${dx}px)`;
        front.style.opacity = String(1 - progress * 0.15);
        // list slides from -30% toward 0
        const listX = -30 + progress * 30; // -30% → 0%
        behind.style.transform = `translateX(${listX}%)`;
        behind.style.opacity = String(0.4 + progress * 0.6);
      }

      function clearInline(front, behind) {
        front.style.transform = '';
        front.style.opacity = '';
        behind.style.transform = '';
        behind.style.opacity = '';
        front.classList.remove('dragging');
        behind.classList.remove('dragging');
      }

      document.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) return;
        startX = lastX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lastT = Date.now();
        dragging = false;
        locked = false;
      }, { passive: true });

      document.addEventListener('touchmove', e => {
        if (locked) return;
        if (!activeTeamId || activeView !== 'standings') return;
        const dx = e.touches[0].clientX - startX;
        const dy = Math.abs(e.touches[0].clientY - startY);

        // Determine intent on first meaningful move
        if (!dragging) {
          if (Math.abs(dx) < 6 && dy < 6) return;
          if (dy > Math.abs(dx)) { locked = true; return; } // vertical scroll
          if (dx < 0) { locked = true; return; }            // leftward swipe
          if (startX > 60 && Math.abs(dx) < 15) return;     // not edge + not moved yet
          dragging = true;
        }

        const { front, behind } = getLayers();
        if (!front || !behind) return;

        front.classList.add('dragging');
        behind.classList.add('dragging');
        setDrag(front, behind, Math.max(0, dx));

        lastX = e.touches[0].clientX;
        lastT = Date.now();
      }, { passive: true });

      document.addEventListener('touchend', e => {
        if (!dragging) return;
        dragging = false;
        locked = false;

        const { front, behind } = getLayers();
        if (!front || !behind) return;

        const dx = e.changedTouches[0].clientX - startX;
        const dt = Date.now() - lastT;
        const velocity = dt > 0 ? (e.changedTouches[0].clientX - lastX) / dt : 0; // px/ms
        const w = window.innerWidth;

        const shouldComplete = dx > w * 0.35 || (dx > 40 && velocity > 0.3);

        if (shouldComplete) {
          // Snap to complete: animate detail off screen, then clear
          front.classList.remove('dragging');
          behind.classList.remove('dragging');
          front.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease';
          behind.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease';
          front.style.transform = `translateX(${w}px)`;
          front.style.opacity = '0';
          behind.style.transform = 'translateX(0)';
          behind.style.opacity = '1';
          setTimeout(() => { clearInline(front, behind); clearTeam(); }, 300);
        } else {
          // Snap back
          front.classList.remove('dragging');
          behind.classList.remove('dragging');
          front.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease';
          behind.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.28s ease';
          front.style.transform = 'translateX(0)';
          front.style.opacity = '1';
          behind.style.transform = 'translateX(-30%)';
          behind.style.opacity = '0';
          setTimeout(() => { clearInline(front, behind); }, 300);
        }
      }, { passive: true });
    })();

    // ── SYNC ─────────────────────────────────────────────────────────────────────

    // ── INSIGHTS ─────────────────────────────────────────────────────────────────
    const SNAPSHOT_KEY = 'hp_pts_snapshot';

    function savePtsSnapshot() {
      const today = new Date().toISOString().slice(0, 10);
      const snap = { date: today, pts: {} };
      teams.forEach(t => { snap.pts[t.id] = teamTotalPts(t); });
      try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snap)); } catch(_) {}
    }

    function loadPtsSnapshot() {
      try {
        const raw = localStorage.getItem(SNAPSHOT_KEY);
        if (!raw) return null;
        const snap = JSON.parse(raw);
        const today = new Date().toISOString().slice(0, 10);
        if (snap.date === today) return null; // same day — no delta yet
        return snap;
      } catch(_) { return null; }
    }

    function buildInsightsTeaser(sorted, leaderPts) {
      const card = (color, icon, label, main, sub) =>
        `<div class="insight-card ${color}"><div class="insight-icon">${icon}</div><div class="insight-label">${label}</div><div class="insight-main ${color}">${main}</div><div class="insight-sub">${sub}</div></div>`;
      const all = computeInsightData(sorted, leaderPts);
      const cards = all.slice(0, 3).map(d => card(d.color, d.icon, d.label, d.main, d.sub));
      if (!cards.length) return '';
      return `<div class="insights">${cards.join('')}<div class="insight-card insight-more-card" onclick="setView('insights')" style="cursor:pointer;align-items:center;justify-content:center;flex-direction:row;gap:0.5rem;border-color:rgba(255,255,255,0.1)"><span style="font-size:0.85rem;color:rgba(255,255,255,0.5)">More insights</span><span style="font-size:0.75rem;color:rgba(255,255,255,0.3)">→</span></div></div>`;
    }

    function buildInsightsPage(sorted, leaderPts) {
      const card = (color, icon, label, main, sub) =>
        `<div class="insight-card ${color}"><div class="insight-icon">${icon}</div><div class="insight-label">${label}</div><div class="insight-main ${color}">${main}</div><div class="insight-sub">${sub}</div></div>`;
      const all = computeInsightData(sorted, leaderPts);
      if (!all.length) return '<div class="msg" style="padding:2rem 0">No insights available yet — check back after games have been played.</div>';
      const cards = all.map(d => card(d.color, d.icon, d.label, d.main, d.sub));
      return `<div class="insights-page-header"><span class="insights-page-title">Pool Insights</span><span class="insights-page-sub">Updated live · ${sorted.length} teams</span></div><div class="insights insights-full">${cards.join('')}</div>`;
    }

    function buildInsights(sorted, leaderPts) {
      const card = (color, icon, label, main, sub) =>
        `<div class="insight-card ${color}"><div class="insight-icon">${icon}</div><div class="insight-label">${label}</div><div class="insight-main ${color}">${main}</div><div class="insight-sub">${sub}</div></div>`;
      const cards = computeInsightData(sorted, leaderPts).map(d => card(d.color, d.icon, d.label, d.main, d.sub));
      return cards.length ? `<div class="insights">${cards.join('')}</div>` : '';
    }

    function computeInsightData(sorted, leaderPts) {
      const data = [];

      // 1. Leading / Closest Race
      if (sorted.length >= 2) {
        const gap = leaderPts - teamTotalPts(sorted[1]);
        if (gap <= 15) data.push({ color:'gold', icon:'🏆', label:'Closest Race', main:`${sorted[0].name} vs ${sorted[1].name}`, sub:`Only ${gap} pts separate 1st and 2nd` });
        else data.push({ color:'gold', icon:'👑', label:'Leading', main:sorted[0].name, sub:`${gap} pts ahead of ${sorted[1].name}` });
      }

      // 2. Best Efficiency
      const effTeams = sorted.map(t => { const cap = teamCapUsed(t.roster), pts = teamTotalPts(t); return { t, eff: cap > 0 ? pts / (cap / 1e6) : 0 }; }).filter(x => x.eff > 0).sort((a, b) => b.eff - a.eff);
      if (effTeams.length) { const best = effTeams[0]; data.push({ color:'green', icon:'⚡', label:'Best Efficiency', main:best.t.name, sub:`${best.eff.toFixed(2)} pts per $M — best in pool` }); }

      // 3. Best Steal
      const allP = [];
      teams.forEach(t => { const rp = rosterPlayers(t.roster); [...rp.F, ...rp.D, ...rp.G].filter(Boolean).forEach(p => { const pts = poolScoreOwned(p, t, p._slug), capM = (p.cap_hit || 0) / 1e6; if (pts > 0 && capM > 0) allP.push({ p, t, pts, capM, ratio: pts / capM }); }); });
      allP.sort((a, b) => b.ratio - a.ratio);
      if (allP.length) { const steal = allP[0]; data.push({ color:'blue', icon:'🚀', label:'Best Steal', main:formatName(steal.p.player_name), sub:`${steal.pts} pts · $${steal.capM.toFixed(1)}M · owned by ${steal.t.name}` }); }

      // 4. Worst Contract
      const expensive = allP.filter(x => x.capM >= 2 && x.pts >= 1).sort((a, b) => a.ratio - b.ratio);
      if (expensive.length) { const bust = expensive[0]; data.push({ color:'red', icon:'💸', label:'Worst Contract', main:formatName(bust.p.player_name), sub:`${bust.pts} pts · $${bust.capM.toFixed(1)}M · owned by ${bust.t.name}` }); }

      // 5. Biggest Mover (yesterday → today delta via localStorage snapshot)
      const snap = loadPtsSnapshot();
      if (snap) {
        const movers = sorted.map(t => {
          const prev = snap.pts?.[t.id];
          if (prev === undefined) return null;
          return { t, delta: teamTotalPts(t) - prev };
        }).filter(x => x && x.delta > 0).sort((a, b) => b.delta - a.delta);
        if (movers.length) {
          const top = movers[0];
          data.push({ color:'green', icon:'📈', label:'Biggest Mover', main:top.t.name, sub:`+${top.delta} pts since yesterday` });
        }
      }
      savePtsSnapshot();

      // 6. Biggest Carry
      const carryData = [];
      teams.forEach(t => {
        const total = teamTotalPts(t);
        if (total <= 0) return;
        const rp = rosterPlayers(t.roster);
        [...rp.F, ...rp.D, ...rp.G].filter(Boolean).forEach(p => {
          const pts = poolScoreOwned(p, t, p._slug);
          if (pts > 0) carryData.push({ p, t, pts, pct: pts / total });
        });
      });
      carryData.sort((a, b) => b.pct - a.pct);
      if (carryData.length) {
        const top = carryData[0];
        data.push({ color:'blue', icon:'🏋️', label:'Biggest Carry', main:formatName(top.p.player_name), sub:`${top.pts} pts — ${Math.round(top.pct * 100)}% of ${top.t.name}'s total` });
      }

      // 7. Coldest Team — position group ranked last in the pool
      const coldCandidates = [];
      ['F','D','G'].forEach(pos => {
        const posScore = t => { const s = teamSubScores(t); return pos === 'F' ? s.F + s.BF : pos === 'D' ? s.D + s.BD : s.G + s.BG; };
        const ranked = [...teams].map(t => ({ t, score: posScore(t) })).sort((a, b) => a.score - b.score);
        const last = ranked[0];
        const second = ranked[1];
        if (last && second && second.score - last.score >= 5) {
          coldCandidates.push({ t: last.t, pos, score: last.score, gap: second.score - last.score });
        }
      });
      coldCandidates.sort((a, b) => b.gap - a.gap);
      if (coldCandidates.length) {
        const cold = coldCandidates[0];
        const posLabel = { F: 'Forwards', D: 'Defence', G: 'Goalies' }[cold.pos];
        data.push({ color:'red', icon:'🥶', label:'Coldest Team', main:cold.t.name, sub:`${posLabel} last in pool with ${cold.score} pts` });
      }

      // 8. Best Forward (most pts by a single F)
      const bestF = allP.filter(x => normalizePos(x.p.position) !== 'G' && normalizePos(x.p.position) !== 'D').sort((a, b) => b.pts - a.pts);
      if (bestF.length) { const top = bestF[0]; data.push({ color:'gold', icon:'⚽', label:'Best Forward', main:formatName(top.p.player_name), sub:`${top.pts} pts · owned by ${top.t.name}` }); }

      // 9. Best Defenceman (most pts by a single D)
      const bestD = allP.filter(x => normalizePos(x.p.position) === 'D').sort((a, b) => b.pts - a.pts);
      if (bestD.length) { const top = bestD[0]; data.push({ color:'blue', icon:'🛡️', label:'Best Defenceman', main:formatName(top.p.player_name), sub:`${top.pts} pts · owned by ${top.t.name}` }); }

      // 10. Best Goalie (most pts by a single G)
      const gAllP = [];
      teams.forEach(t => { const rp = rosterPlayers(t.roster); [...rp.G].filter(Boolean).forEach(p => { const pts = poolScoreOwned(p, t, p._slug); gAllP.push({ p, t, pts }); }); });
      gAllP.sort((a, b) => b.pts - a.pts);
      if (gAllP.length && gAllP[0].pts > 0) { const top = gAllP[0]; data.push({ color:'green', icon:'🧤', label:'Best Goalie', main:formatName(top.p.player_name), sub:`${top.pts} pts · owned by ${top.t.name}` }); }

      // 11. Most GP across a roster
      const gpTeams = sorted.map(t => {
        const rp = rosterPlayers(t.roster);
        const gp = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).reduce((s, p) => s + (ownedStatsDelta(p, t, p._slug)?.gamesPlayed ?? 0), 0);
        return { t, gp };
      }).sort((a, b) => b.gp - a.gp);
      if (gpTeams.length && gpTeams[0].gp > 0) { const top = gpTeams[0]; data.push({ color:'blue', icon:'🎮', label:'Most GP Played', main:top.t.name, sub:`${top.gp} total games played across roster` }); }

      // 12. Deepest Roster (most players with ≥1 pt)
      const deepTeams = sorted.map(t => {
        const rp = rosterPlayers(t.roster);
        const scorers = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).filter(p => poolScoreOwned(p, t, p._slug) >= 1).length;
        return { t, scorers };
      }).sort((a, b) => b.scorers - a.scorers);
      if (deepTeams.length && deepTeams[0].scorers > 0) { const top = deepTeams[0]; data.push({ color:'green', icon:'🌊', label:'Deepest Roster', main:top.t.name, sub:`${top.scorers} players with 1+ pts — most in pool` }); }

      // 13. Best PPG (pts per game played, min 10 GP across roster)
      const ppgTeams = sorted.map(t => {
        const rp = rosterPlayers(t.roster);
        const gp = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).reduce((s, p) => s + (ownedStatsDelta(p, t, p._slug)?.gamesPlayed ?? 0), 0);
        const pts = teamTotalPts(t);
        return { t, ppg: gp >= 10 ? pts / gp : 0, gp };
      }).filter(x => x.ppg > 0).sort((a, b) => b.ppg - a.ppg);
      if (ppgTeams.length) { const top = ppgTeams[0]; data.push({ color:'gold', icon:'📊', label:'Best Avg PPG', main:top.t.name, sub:`${top.ppg.toFixed(2)} pts/game across ${top.gp} GP` }); }

      // 14. Dead Weight (most 0-pt players on dressed roster)
      const deadTeams = sorted.map(t => {
        const rp = rosterPlayers(t.roster);
        const zeros = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).filter(p => poolScoreOwned(p, t, p._slug) === 0).length;
        const total = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).length;
        return { t, zeros, total };
      }).filter(x => x.zeros > 0).sort((a, b) => b.zeros - a.zeros);
      if (deadTeams.length) { const top = deadTeams[0]; data.push({ color:'red', icon:'🪦', label:'Dead Weight', main:top.t.name, sub:`${top.zeros} of ${top.total} dressed players still at 0 pts` }); }

      // 15. Sniper (most goals by a single player pool-wide)
      const sniperData = [];
      teams.forEach(t => {
        const rp = rosterPlayers(t.roster);
        [...rp.F, ...rp.D].filter(Boolean).forEach(p => {
          const d = ownedStatsDelta(p, t, p._slug);
          const g = d?.goals ?? 0;
          if (g > 0) sniperData.push({ p, t, g });
        });
      });
      sniperData.sort((a, b) => b.g - a.g);
      if (sniperData.length) { const top = sniperData[0]; data.push({ color:'red', icon:'🎯', label:'Top Sniper', main:formatName(top.p.player_name), sub:`${top.g} goals · owned by ${top.t.name}` }); }

      // 16. Playmaker (most assists by a single player pool-wide)
      const playmakerData = [];
      teams.forEach(t => {
        const rp = rosterPlayers(t.roster);
        [...rp.F, ...rp.D].filter(Boolean).forEach(p => {
          const d = ownedStatsDelta(p, t, p._slug);
          const a = d?.assists ?? 0;
          if (a > 0) playmakerData.push({ p, t, a });
        });
      });
      playmakerData.sort((a, b) => b.a - a.a);
      if (playmakerData.length) { const top = playmakerData[0]; data.push({ color:'blue', icon:'🎪', label:'Top Playmaker', main:formatName(top.p.player_name), sub:`${top.a} assists · owned by ${top.t.name}` }); }

      // 17. Hottest Team (most pts scored yesterday via snapshot delta)
      if (Object.keys(_playerYesterdayPtsBySlug).length > 0) {
        const hotTeams = sorted.map(t => {
          const rp = rosterPlayers(t.roster);
          const ytd = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).reduce((s, p) => s + (_playerYesterdayPtsBySlug[p._slug] ?? 0), 0);
          return { t, ytd };
        }).filter(x => x.ytd > 0).sort((a, b) => b.ytd - a.ytd);
        if (hotTeams.length) { const top = hotTeams[0]; data.push({ color:'green', icon:'🔥', label:'Hottest Team', main:top.t.name, sub:`+${top.ytd} pts yesterday — most in pool` }); }
      }

      // 18. Closest to Escape (last-place team with smallest gap to 2nd-last)
      if (sorted.length >= 3) {
        const last = sorted[sorted.length - 1];
        const secondLast = sorted[sorted.length - 2];
        const escapeGap = teamTotalPts(secondLast) - teamTotalPts(last);
        if (escapeGap <= 20) data.push({ color:'green', icon:'🚪', label:'Closest to Escape', main:last.name, sub:`Only ${escapeGap} pts behind ${secondLast.name}` });
        else data.push({ color:'red', icon:'⛓️', label:'Stuck in Last', main:last.name, sub:`${escapeGap} pts behind ${secondLast.name}` });
      }

      return data;
    }

    function buildLeaderboard(sorted, leaderPts) {
      const n = sorted.length;
      const rowsHtml = sorted.map((t, i) => {
        const pts = teamTotalPts(t);
        const sub = teamSubScores(t);
        const live = liveSubPts(t);
        const ppg = teamAvgPPG(t);
        const gap = i === 0 ? 'Leader' : `−${leaderPts - pts}`;
        const rp = rosterPlayers(t.roster);
        const ownedGP = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).reduce((s, p) => {
          return s + (ownedStatsDelta(p, t, p._slug)?.gamesPlayed ?? 0);
        }, 0);

        const rankNum = i + 1;
        const rankCls = rankNum === 1 ? 'gold' : rankNum === 2 ? 'silver' : rankNum === 3 ? 'bronze' : '';
        const rankInner = rankNum === 1
          ? `<div class="lb-rank-crown"><span class="lb-rank-crown-icon">👑</span><span class="lb-rank-num">${rankNum}</span></div>`
          : `<span class="lb-rank-num">${rankNum}</span>`;
        const tierCls = rankNum <= 3 ? ` rank-${rankNum}` : '';
        const isActive = t.id === activeTeamId;
        const snapEntry = _lastSnapshot[t.id];

        // Rank change arrow from last snapshot
        const prevRank = snapEntry?.rank ?? null;
        let rankChangeBadge = '';
        if (prevRank && prevRank !== rankNum) {
          const diff = prevRank - rankNum;
          rankChangeBadge = diff > 0
            ? `<div class="rank-change up">▲${diff}</div>`
            : `<div class="rank-change down">▼${Math.abs(diff)}</div>`;
        } else if (prevRank) {
          rankChangeBadge = `<div class="rank-change same">—</div>`;
        }

        // Tonight count — dressed players with a game tonight
        const tonightCount = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).filter(p => {
          const abbr = TEAM_ABBR[p.team];
          return abbr && teamsPlayingToday.has(abbr);
        }).length;
        const tonightHtml = teamsPlayingToday.size > 0
          ? `<div class="lb-tonight${tonightCount === 0 ? ' zero' : ''}">${tonightCount > 0 ? tonightCount : '—'}</div>`
          : `<div class="lb-tonight zero">—</div>`;

        // Yesterday pts — use player-level data if available, else fall back to team snapshot delta
        const playerYtdSum = [...rp.F, ...rp.D, ...rp.G].filter(Boolean).reduce((s, p) => {
          return s + (_playerYesterdayPts[p.nhl_player_id] ?? 0);
        }, 0);
        const prevPts = _yesterdaySnapshot[t.id];
        const snapshotDelta = prevPts != null ? teamTotalPts(t) - prevPts : null;
        const teamYtd = playerYtdSum > 0 ? playerYtdSum : (snapshotDelta != null && snapshotDelta > 0 ? snapshotDelta : 0);
        const ytdCls = teamYtd > 0 ? 'pos' : 'zero';
        const ytdLabel = teamYtd > 0 ? `+${teamYtd}` : '—';
        const ytdHtmlStandings = `<div class="lb-stat delta ${ytdCls}">${ytdLabel}</div>`;

        // Live pts badge
        const livePtsTeam = liveTeamPts(t);
        const liveBadge = livePtsTeam > 0 ? `<span class="live-badge">+${livePtsTeam}</span>` : '';

        const row = `<div class="lb-row${tierCls}${isActive ? ' active' : ''}" onclick="selectTeam('${encodeURIComponent(t.id)}')">
          <div class="lb-rank ${rankCls}">${rankInner}${rankChangeBadge}</div>
          <div class="lb-name-wrap"><span class="lb-name">${t.name}</span>${liveBadge}</div>
          <div class="lb-stat lb-col-hide">${ownedGP}</div>
          <div class="lb-stat lb-col-hide pos-f">${sub.F + sub.BF + live.F}</div>
          <div class="lb-stat lb-col-hide pos-d">${sub.D + sub.BD + live.D}</div>
          <div class="lb-stat lb-col-hide pos-g">${sub.G + sub.BG + live.G}</div>
          <div class="lb-stat pts">${pts}</div>
          <div class="lb-stat lb-col-hide-mobile" style="color:rgba(255,255,255,0.5)">${ppg ?? '—'}</div>
          ${ytdHtmlStandings}
          ${tonightHtml}
          <div class="lb-stat ${i===0?'gap leader':'gap'}">${gap}</div>
        </div>`;

        return rankNum === 3 && n > 3 ? row + `<div class="lb-tier-divider"></div>` : row;
      }).join('');

      return `<div class="leaderboard">
        <div class="lb-row header">
          <div></div>
          <div class="lb-col-label left">Team</div>
          <div class="lb-col-label lb-col-hide">GP</div>
          <div class="lb-col-label lb-col-hide" style="color:var(--pink)">F</div>
          <div class="lb-col-label lb-col-hide" style="color:var(--blue)">D</div>
          <div class="lb-col-label lb-col-hide" style="color:var(--gold)">G</div>
          <div class="lb-col-label">Total</div>
          <div class="lb-col-label lb-col-hide-mobile" title="Pool points per games played">PPG</div>
          <div class="lb-col-label" style="color:var(--green);opacity:0.7" title="Points scored yesterday">Ytd</div>
          <div class="lb-col-label" style="color:var(--gold);opacity:0.7" title="Players with a game tonight">🏒</div>
          <div class="lb-col-label">Gap</div>
        </div>
        ${rowsHtml}
      </div>`;
    }

    // ── TEAM DETAIL ───────────────────────────────────────────────────────────────
    function buildDetail(team, sorted, leaderPts) {
      const roster = rosterPlayers(team.roster);
      const allPlrs = [...roster.F, ...roster.D, ...roster.G, ...(roster.B||[])].filter(Boolean);
      if (!allPlrs.length) return `<div class="msg" style="padding:1.5rem 0;">No players drafted yet.</div>`;

      const sub = teamSubScores(team);
      const live = liveSubPts(team);
      const totalPts = teamTotalPts(team);
      const cap = teamCapUsed(team.roster);
      const filled = teamFilled(team.roster);
      const eff = cap > 0 ? (totalPts / (cap / 1e6)).toFixed(1) : '—';
      const ppg = teamAvgPPG(team);
      const rank = sorted.findIndex(t => t.id === team.id) + 1;
      const gap = rank === 1 ? 'Leading 🏆' : `${leaderPts - totalPts} pts behind 1st`;
      const n = teams.length;
      const hasF = roster.F.some(Boolean), hasD = roster.D.some(Boolean), hasG = roster.G.some(Boolean);

      function posBlock(pos, label, val) {
        const r = posRankForTeam(team, pos);
        const { text: rankText, cls: rankCls } = posRankLabel(r, n);
        return `<div class="pos-score-block ${pos}${r === 1 ? ' rank-1st' : ''}">
          <div class="pos-score-val">${val}</div>
          <div class="pos-score-label">${label}</div>
          <div class="pos-rank-badge ${rankCls}">${rankText}</div>
        </div>`;
      }

      const { text: totalRankText, cls: totalRankCls } = posRankLabel(rank, n);
      const totalBlock = `<div class="pos-score-block T${rank === 1 ? ' rank-1st' : ''}">
        <div class="pos-score-val">${totalPts}</div>
        <div class="pos-score-label">Total</div>
        <div class="pos-rank-badge ${totalRankCls}">${totalRankText}</div>
      </div>`;



      return `
        <div class="detail-header">
          <div class="detail-header-left">
            <div class="detail-title">${team.name}</div>
            <div class="detail-rank-row">
              <span class="detail-rank-pill ${totalRankCls}">${totalRankText}</span>
              <span class="detail-gap-label${rank === 1 ? ' leader' : ''}">${gap}</span>
            </div>
          </div>
          <div class="detail-header-right">
            <div class="detail-summary">
              <span class="detail-badge cap">$${(cap / 1e6).toFixed(1)}M</span>
              <span class="detail-badge filled">${filled}/20</span>
              <span class="detail-badge eff">${eff} pt/$M</span>
              ${ppg ? `<span class="detail-badge eff" title="Pool points per average games played">${ppg} PPG</span>` : ''}
            </div>
          </div>
        </div>
        <div class="pos-scores-bar">
          ${totalBlock}
          ${posBlock('F', 'Forwards', sub.F + sub.BF + live.F)}
          ${posBlock('D', 'Defence',  sub.D + sub.BD + live.D)}
          ${posBlock('G', 'Goalies',  sub.G + sub.BG + live.G)}
        </div>
        ${hasF ? buildHistTable(team, 'F', 'Forwards') : '<div class="msg" style="padding:0.5rem 0;font-size:0.8rem;text-align:left;color:rgba(255,255,255,0.25)">No forwards drafted yet.</div>'}
        ${hasD ? buildHistTable(team, 'D', 'Defence')  : '<div class="msg" style="padding:0.5rem 0;font-size:0.8rem;text-align:left;color:rgba(255,255,255,0.25)">No defencemen drafted yet.</div>'}
        ${hasG ? buildHistTable(team, 'G', 'Goalies')  : '<div class="msg" style="padding:0.5rem 0;font-size:0.8rem;text-align:left;color:rgba(255,255,255,0.25)">No goalies drafted yet.</div>'}
        ${(() => {
          const m = slugMap();
          const bench = (team.roster.B || []).filter(s => s && typeof s === 'string');
          if (!bench.length) return '';
          const benchSkaters = bench.filter(s => { const p = m[s]; return !p || normalizePos(p.position) !== 'G'; });
          const benchGoalies = bench.filter(s => { const p = m[s]; return p && normalizePos(p.position) === 'G'; });
          const skaterTeam = benchSkaters.length ? { ...team, roster: { ...team.roster, B: benchSkaters } } : null;
          const goalieTeam = benchGoalies.length ? { ...team, roster: { ...team.roster, G: benchGoalies } } : null;
          return (skaterTeam ? buildHistTable(skaterTeam, 'B', 'Bench') : '') +
                 (goalieTeam ? buildHistTable(goalieTeam, 'G', 'Bench (G)') : '');
        })()}
        ${buildSwapHistory(team)}
      `;
    }

    // ── SWAP HISTORY ─────────────────────────────────────────────────────────────
    function buildSwapHistory(team) {
      const swaps = _benchSwaps.filter(s => s.team_id === team.id);
      if (!swaps.length) return '';
      const m = slugMap();
      const fmt = d => new Date(d).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
      const rows = swaps.map(s => {
        const pIn  = m[s.player_in_slug];
        const pOut = m[s.player_out_slug];
        const inAbbr  = pIn  ? TEAM_ABBR[pIn.team]  : null;
        const outAbbr = pOut ? TEAM_ABBR[pOut.team] : null;
        const inLogo  = inAbbr  ? `<img src="https://assets.nhle.com/logos/nhl/svg/${inAbbr}_dark.svg"  style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:4px">` : '';
        const outLogo = outAbbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${outAbbr}_dark.svg" style="width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:4px">` : '';
        const reasonHtml = s.reason
          ? `<span class="swap-reason ${s.reason}">${s.reason === 'injury' ? '🩹 Injury' : '🔄 Tactical'}</span>`
          : '';
        return `<div class="swap-row">
          <div class="swap-date">${fmt(s.swap_date)}</div>
          <div class="swap-move">
            <span class="swap-in">${inLogo}${s.player_in_name}</span>
            <span class="swap-arrow">⇄</span>
            <span class="swap-out">${outLogo}${s.player_out_name}</span>
            ${reasonHtml}
          </div>
          ${s.note ? `<div class="swap-note">${s.note}</div>` : ''}
        </div>`;
      });
      return `
        <div class="swap-history">
          <div class="hist-section-label" style="color:rgba(255,255,255,0.5);border-color:rgba(255,255,255,0.1);margin-top:1.5rem">Bench Swaps</div>
          ${rows.join('')}
        </div>`;
    }

    // ── HIST TABLE ────────────────────────────────────────────────────────────────
    function buildHistTable(team, pos, label) {
      const currentSlugs = new Set([...team.roster.F, ...team.roster.D, ...team.roster.G, ...(team.roster.B||[])].filter(s => s && typeof s === 'string'));
      const activeSlugSet = new Set((team.roster[pos] || []).filter(Boolean));
      const m = slugMap();
      const fmt = d => new Date(d).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });

      const trades = currentTrades.filter(t => {
        if (t.team_id !== team.id || !t.player_to_slug) return false;
        const livePos = m[t.player_to_slug] ? normalizePos(m[t.player_to_slug].position) : null;
        const storedPos = t.player_to_position ? normalizePos(t.player_to_position) : null;
        return (livePos || storedPos) === pos;
      });
      const seenSlugs = new Set(trades.map(t => t.player_to_slug));
      const currentNoDraft = (team.roster[pos] || []).filter(s => s && typeof s === 'string' && currentSlugs.has(s) && !seenSlugs.has(s)).map(s => m[s] ? { ...m[s], _slug: s } : { puckpedia_slug: s, player_name: s.split('/').pop()?.replace(/-/g,' '), position: pos === 'B' ? '' : pos, cap_hit: 0, _slug: s, _unknown: true }).filter(Boolean);

      // Inject bench-swapped-out players as past rows (only for F/D/G tables, not bench)
      const swapOutRows = pos !== 'B' ? _benchSwaps.filter(s => {
        if (s.team_id !== team.id) return false;
        const swapPos = normalizePos(s.player_out_position);
        return swapPos === pos && !seenSlugs.has(s.player_out_slug);
      }).map(s => {
        const p = m[s.player_out_slug];
        const abbr = p ? TEAM_ABBR[p.team] : null;
        const logo = abbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        const swapDate = new Date(s.swap_date);
        const tenure = `Season start → ${fmt(swapDate)}`;
        const swapGp = p?.games_played ?? 0;
        const swapG  = p?.goals ?? 0;
        const swapA  = p?.assists ?? 0;
        const swapPos2 = normalizePos(s.player_out_position);
        const col1v = swapGp || '—';
        const col2v = swapPos2 === 'G' ? (p?.wins ?? '—') : (swapG || '—');
        const col3v = swapPos2 === 'G' ? (p?.ot_losses ?? '—') : (swapA || '—');
        const swapSo  = p?.shutouts ?? 0;
        const swapOtl = p?.ot_losses ?? 0;
        const swapPpg = swapPos2 !== 'G' && swapGp > 0 && typeof (s.player_out_pts_at_swap) === 'number'
          ? (s.player_out_pts_at_swap / swapGp).toFixed(2) : null;
        return { isCurrent: false, cls: 'past', name: s.player_out_name, logo, vsLogo: '',
          tenure, col1: col1v, col2: col2v, col3: col3v,
          pts: s.player_out_pts_at_swap ?? '—',
          gp: swapGp, g: swapG, a: swapA, w: p?.wins ?? 0, so: swapSo, otl: swapOtl,
          actualPos: swapPos2,
          nhlId: p?.nhl_player_id || null, slug: p?.puckpedia_slug || null,
          capHit: p?.cap_hit || null, nhlTeam: p?.team || null, owner: team.name,
          ppg: swapPpg, ytd: null, _fromSwap: true };
      }) : [];
      if (!trades.length && !currentNoDraft.length && !swapOutRows.length) return '';

      /*
       * Column header — sortable. Default sort: pts desc.
       * F/D cols: GP · G · A · Pts
       * G   cols: W  · SO · GP · Pts
       */
      const sortField = _rosterSort[pos] || 'pts';
      const arrow = f => f === sortField ? ' ▾' : '';
      const sortHdr = (f, label) =>
        `<div class="lb-col-label sort-hdr" style="cursor:pointer;user-select:none" onclick="setRosterSort('${pos}','${f}')">${label}${arrow(f)}</div>`;

      const colHeader = `
        <div class="hist-header-row">
          <div class="hist-pos-hdr-cell"></div>
          <div class="lb-col-label left">Player</div>
          ${pos==='G'
            ? `${sortHdr('gp','GP')}<div class="lb-col-label hist-g-hide-mobile">${sortHdr('w','W')}</div><div class="lb-col-label hist-g-hide-mobile">${sortHdr('otl','OTL')}</div>`
            : `${sortHdr('gp','GP')}<div class="lb-col-label hist-col-hide">${sortHdr('g','G')}</div><div class="lb-col-label hist-col-hide">${sortHdr('a','A')}</div>`}
          ${sortHdr('pts','Pts')}
          ${pos==='G' ? `
            <div class="lb-col-label hist-g-hide-mobile" style="color:rgba(255,255,255,0.4)" title="Shutouts">SO</div>
            <div class="lb-col-label hist-g-show-mobile" style="color:rgba(255,255,255,0.4)" title="Points per games played">PPG</div>
          ` : `<div class="lb-col-label" style="color:rgba(255,255,255,0.4)" title="Points per games played">PPG</div>`}
          <div class="lb-col-label" style="color:var(--green);opacity:0.7" title="Points scored yesterday">Ytd</div>
        </div>`;

      // Build data objects for all rows so we can sort before rendering
      const rowData = [];

      trades.forEach(t => {
        const isCurrent = activeSlugSet.has(t.player_to_slug);
        const tradeKey = tradeWindowKey(t, isCurrent);
        const p = m[t.player_to_slug] ? { ...m[t.player_to_slug], _slug: t.player_to_slug } : null;
        const abbr = p ? TEAM_ABBR[p.team] : null;
        const opponentAbbr = isCurrent && abbr ? tonightMatchups[abbr] : null;
        const vsLogo = opponentAbbr ? `<span style="font-size:0.65rem;font-weight:700;color:rgba(255,255,255,0.3);font-family:'Barlow Condensed',sans-serif;line-height:1;margin-left:0.25rem">vs</span><img src="https://assets.nhle.com/logos/nhl/svg/${opponentAbbr}_dark.svg" alt="${opponentAbbr}" title="vs ${opponentAbbr} tonight" style="width:16px;height:16px;object-fit:contain;opacity:0.7;">` : '';
        const logo = abbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        const acqDate = t.date_from_acquired ? new Date(t.date_from_acquired) : ACTIVE_ACQUIRED_FALLBACK_DATE;
        const tenureTooltip = isCurrent
          ? `${fmt(acqDate)} → Now`
          : t.date_traded ? `${fmt(acqDate)} → ${fmt(t.date_traded)}` : `${fmt(acqDate)} → Now`;
        let col1='—', col2='—', col3='—', pts, gp=0, g=0, a=0, w=0, so=0, otl=0;
        if (isCurrent && p) {
          const d = ownedStatsDelta(p, team, p._slug);
          gp=d.gamesPlayed; g=d.goals; a=d.assists; w=d.wins; so=d.shutouts; otl=d.otLosses;
          if (pos === 'G') { col1 = gp; col2 = w; col3 = otl; }
          else             { col1 = gp; col2 = g; col3 = a; }
          pts = poolScoreOwned(p, team, p._slug);
        } else {
          pts = _windowPtsByTradeKey[tradeKey] ?? t.points_accumulated_at_trade ?? '—';
        }
        rowData.push({ isCurrent, cls: isCurrent?'current':'past', name: t.player_to_name||t.player_to_slug, logo, vsLogo, tenure: tenureTooltip, col1, col2, col3, pts, gp, g, a, w, so, otl,
          actualPos: p ? normalizePos(p.position) : pos,
          nhlId: p?.nhl_player_id || null, slug: p?.puckpedia_slug || null,
          capHit: p?.cap_hit || null, nhlTeam: p?.team || null, owner: team.name,
          ppg: (isCurrent && typeof pts === 'number' && gp > 0) ? (pts / gp).toFixed(2) : null,
          ytd: isCurrent ? ((_playerYesterdayPts[p?.nhl_player_id] || 0) || (_playerYesterdayPtsBySlug[p?.puckpedia_slug] ?? 0)) : null });
      });

      currentNoDraft.forEach(p => {
        const abbr = TEAM_ABBR[p.team];
        const opponentAbbr = abbr ? tonightMatchups[abbr] : null;
        const vsLogo = opponentAbbr ? `<span style="font-size:0.65rem;font-weight:700;color:rgba(255,255,255,0.3);font-family:'Barlow Condensed',sans-serif;line-height:1;margin-left:0.25rem">vs</span><img src="https://assets.nhle.com/logos/nhl/svg/${opponentAbbr}_dark.svg" alt="${opponentAbbr}" title="vs ${opponentAbbr} tonight" style="width:16px;height:16px;object-fit:contain;opacity:0.7;">` : '';
        const logo = abbr ? `<img src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
        const d = ownedStatsDelta(p, team, p._slug);
        const gp=d.gamesPlayed, g=d.goals, a=d.assists, w=d.wins, so=d.shutouts, otl=d.otLosses;
        let col1='—', col2='—', col3='—';
        if (pos === 'G') { col1 = gp; col2 = w; col3 = otl; }
        else             { col1 = gp; col2 = g; col3 = a; }
        const pts = poolScoreOwned(p, team, p._slug);
        const acqDate = resolveActiveAcquiredDate(team, p._slug);
        const hasAcqDate = acqDate.getTime() !== ACTIVE_ACQUIRED_FALLBACK_DATE.getTime();
        const tenure = `${fmt(acqDate)} → Now`;
        rowData.push({ isCurrent: true, cls: 'current', name: formatName(p.player_name), logo, vsLogo, tenure, col1, col2, col3, pts, gp, g, a, w, so, otl,
          _acqDateChip: hasAcqDate ? `${fmt(acqDate)} → Now` : null,
          actualPos: p.position ? normalizePos(p.position) : pos,
          nhlId: p.nhl_player_id || null, slug: p.puckpedia_slug || null,
          capHit: p.cap_hit || null, nhlTeam: p.team || null, owner: team.name,
          ppg: (typeof pts === 'number' && gp > 0) ? (pts / gp).toFixed(2) : null,
          ytd: (_playerYesterdayPts[p.nhl_player_id] || 0) || (_playerYesterdayPtsBySlug[p.puckpedia_slug] ?? 0) });
      });

      // Add bench-swapped-out players as past rows
      swapOutRows.forEach(r => rowData.push(r));

      // Sort: current players first, then by selected field desc, past players always last
      const sortKey = { pts:'pts', gp:'gp', g:'g', a:'a', w:'w', so:'so', otl:'otl' }[sortField] || 'pts';
      rowData.sort((a, b) => {
        if (a.isCurrent !== b.isCurrent) return a.isCurrent ? -1 : 1;
        const av = typeof a[sortKey] === 'number' ? a[sortKey] : -1;
        const bv = typeof b[sortKey] === 'number' ? b[sortKey] : -1;
        return bv - av;
      });

      const renderedRows = rowData.map(r => {
        const ytdVal = r.ytd != null ? r.ytd : null;
        const ytdHtml = ytdVal == null
          ? `<span class="hist-ytd zero">—</span>`
          : ytdVal > 0
            ? `<span class="hist-ytd pos">+${ytdVal}</span>`
            : `<span class="hist-ytd zero">—</span>`;
        const livePtsPlayer = r.isCurrent && r.nhlId ? (_livePts[r.nhlId] ?? 0) : 0;
        const liveHtml = livePtsPlayer > 0 ? `<span class="live-badge">+${livePtsPlayer}</span>` : '';
        const swapDateChip = r._fromSwap
          ? `<span class="swap-date-chip">${r.tenure}</span>`
          : r._acqDateChip ? `<span class="swap-date-chip">${r._acqDateChip}</span>` : '';
        const modalData = JSON.stringify({ name: r.name, pos: r.actualPos||pos, nhlTeam: r.nhlTeam, nhlId: r.nhlId, isCurrent: r.isCurrent, gp: r.gp, g: r.g, a: r.a, w: r.w, so: r.so, pts: r.pts, ppg: r.ppg, ytd: r.ytd, capHit: r.capHit, tenure: r.tenure, owner: r.owner }).replace(/'/g, '&#39;');
        return `<div class="hist-row ${r.cls}">
          <span class="hist-pos ${r.actualPos||pos}">${r.actualPos||pos}</span>
          <span class="hist-name${r.isCurrent?'':' past'}" title="${r.tenure}" onclick="showPlayerModal(JSON.parse(this.dataset.d))" data-d='${modalData}' style="cursor:pointer">${r.logo}${r.name}${r.vsLogo||''}${liveHtml}${swapDateChip}</span>
          <span class="hist-stat">${r.col1}</span>
          ${pos==='G' ? `
            <span class="hist-stat hist-g-hide-mobile">${r.col2}</span>
            <span class="hist-stat hist-g-hide-mobile">${r.col3}</span>
            <span class="hist-pts">${r.pts}</span>
            <span class="hist-stat hist-g-hide-mobile" style="color:rgba(255,255,255,0.4);font-size:0.78rem">${r.so ?? '—'}</span>
            <span class="hist-stat hist-g-show-mobile" style="color:rgba(255,255,255,0.4);font-size:0.78rem">${r.ppg ?? '—'}</span>
          ` : `
            <span class="hist-stat hist-col-hide">${r.col2}</span>
            <span class="hist-stat hist-col-hide">${r.col3}</span>
            <span class="hist-pts">${r.pts}</span>
            <span class="hist-stat" style="color:rgba(255,255,255,0.4);font-size:0.78rem">${r.ppg ?? '—'}</span>
          `}
          ${ytdHtml}
        </div>`;
      });

      const allPts = rowData.map(r => typeof r.pts === 'number' ? r.pts : 0);
      const total = allPts.reduce((s, v) => s + v, 0);

      return `<div class="hist-table${pos==='G'?' hist-table-g':''}">
        <div class="hist-section-label ${pos}">${label}</div>
        ${colHeader}
        ${renderedRows.join('')}
        <div class="hist-row total">
          <div class="hist-pos-hdr-cell"></div>
          <div class="lb-col-label left" style="font-size:0.75rem">TOTAL</div>
          <div></div>
          <div class="${pos==='G'?'hist-g-hide-mobile':'hist-col-hide'}"></div>
          <div class="${pos==='G'?'hist-g-hide-mobile':'hist-col-hide'}"></div>
          <div class="hist-pts total">${total}</div>
          ${pos==='G' ? `<div class="hist-g-hide-mobile"></div><div class="hist-g-show-mobile"></div>` : `<div></div>`}
          <div></div>
        </div>
      </div>`;
    }

    // ── POOL LEADERS ──────────────────────────────────────────────────────────────
    function buildPoolLeaders() {
      const drafted = allDraftedPlayers();
      const byPos = { F: [], D: [], G: [] };
      drafted.forEach(({ player, owner, pos, team }) => {
        byPos[pos].push({ player, owner, team, pts: poolScoreOwned(player, team, player._slug) });
      });
      ['F','D','G'].forEach(pos => byPos[pos].sort((a, b) => b.pts - a.pts));
      const posLabels = { F: 'Forwards', D: 'Defence', G: 'Goalies' };

      let grandTotal = 0;

      /* FIX 2: position column total row + FIX 6: pos pill next to player name */
      const grid = `
        <div class="pool-section-title">Position <span>Leaders</span></div>
        <div class="pos-jump-nav">
          <button class="pos-jump-btn F" onclick="document.getElementById('pos-col-F').scrollIntoView({behavior:'smooth',block:'start'})">Forwards</button>
          <button class="pos-jump-btn D" onclick="document.getElementById('pos-col-D').scrollIntoView({behavior:'smooth',block:'start'})">Defence</button>
          <button class="pos-jump-btn G" onclick="document.getElementById('pos-col-G').scrollIntoView({behavior:'smooth',block:'start'})">Goalies</button>
        </div>
        <div class="pos-leaders-grid">
          ${['F','D','G'].map(pos => {
            const slice = byPos[pos].slice(0, 10);
            const colTotal = slice.reduce((s, item) => s + item.pts, 0);
            grandTotal += colTotal;
            return `<div class="pos-leader-col" id="pos-col-${pos}">
              <div class="pos-leader-col-header ${pos}">${posLabels[pos]} <small>POOL PTS</small></div>
              ${slice.map((item, i) => {
                const abbr = TEAM_ABBR[item.player.team];
                return `<div class="pos-leader-row">
                  <div class="pos-leader-rank">${i+1}</div>
                  <div class="pos-leader-name">${formatName(item.player.player_name)}</div>
                  <div class="pos-leader-team">${abbr||'—'}</div>
                  <div class="pos-leader-owner" ${ownerBadge(item.owner)}>${item.owner}</div>
                  <div class="pos-leader-pts">${item.pts}</div>
                </div>`;
              }).join('')}
              <div class="pos-leader-total">
                <span class="pos-leader-total-label">Top 10 total</span>
                <span class="pos-leader-total-pts">${colTotal} pts</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="pos-leaders-grand-total">
          Combined top-10 pool pts across all positions <strong>${grandTotal}</strong>
        </div>`;

      const allS = drafted.map(({ player, owner, pos, team }) => ({ player, owner, pos, team, pts: poolScoreOwned(player, team, player._slug) })).sort((a, b) => b.pts - a.pts).slice(0, 10);

      const top = `
        <div class="pool-section-title">Top <span>Pool Players</span></div>
        <div class="top-players-list">
          <div class="top-player-row header">
            <div></div>
            <div class="lb-col-label left">Player</div>
            <div class="lb-col-label">Owner</div>
            <div class="lb-col-label top-col-hide">GP</div>
            <div class="lb-col-label top-col-hide">G</div>
            <div class="lb-col-label top-col-hide">A</div>
            <div class="lb-col-label">Pts</div>
          </div>
          ${allS.map((item, i) => {
            const p = item.player;
            const abbr = TEAM_ABBR[p.team];
            const logo = abbr ? `<img class="top-player-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_dark.svg" alt="${abbr}">` : '';
            const d = ownedStatsDelta(p, item.team, p._slug);
            const s1 = d.pos === 'G' ? d.wins   : d.goals;
            const s2 = d.pos === 'G' ? d.shutouts : d.assists;
            return `<div class="top-player-row">
              <div class="top-player-rank">${i+1}</div>
              <div class="top-player-info">${logo}
                <div>
                  <div class="top-player-name">${formatName(p.player_name)}</div>
                </div>
                <span class="pos-pill ${item.pos}">${item.pos}</span>
              </div>
              <div class="top-player-owner" ${ownerBadge(item.owner)}>${item.owner}</div>
              <div class="top-player-stat top-col-hide">${d.gamesPlayed}</div>
              <div class="top-player-stat top-col-hide">${s1}</div>
              <div class="top-player-stat top-col-hide">${s2}</div>
              <div class="top-player-pts">${item.pts}</div>
            </div>`;
          }).join('')}
        </div>`;

      return grid + top;
    }

    // ── HISTORY / BUMP CHART ─────────────────────────────────────────────────────
    const TEAM_COLORS = [
      '#ffb81c','#7db4ff','#ff7a8a','#22c55e','#c084fc','#fb923c','#38bdf8','#f472b6',
      '#a3e635','#facc15','#f87171','#34d399',
    ];

    let _historyCache = null;
    let _historyRenderedHtml = null;

    async function loadHistory() {
      const el = document.getElementById('view-history');
      if (!el) return;

      if (_historyRenderedHtml) { el.innerHTML = _historyRenderedHtml; return; }
      if (_historyCache) { renderBumpChart(_historyCache, el); return; }

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/pool_standings_snapshots?league_code=eq.${_leagueCode}&order=snapshot_date.asc&select=snapshot_date,standings`,
          { headers: sbHeaders() }
        );
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) {
          el.innerHTML = '<div class="bump-empty">No history yet — check back tomorrow after the daily sync runs.</div>';
          return;
        }
        _historyCache = rows;
        renderBumpChart(rows, el);
      } catch(e) {
        el.innerHTML = '<div class="bump-empty">Could not load history.</div>';
      }
    }

    let _bumpMode = 'pts'; // 'pts' | 'rank'

    function buildWeeklyReview(rows) {
      if (!rows || rows.length < 2) return '';
      const latest = rows[rows.length - 1];
      const latestDate = new Date(latest.snapshot_date);
      const cutoff = new Date(latestDate); cutoff.setDate(cutoff.getDate() - 7);
      // Find the snapshot closest to (but not after) 7 days ago
      const baseRow = [...rows].reverse().find(r => new Date(r.snapshot_date) <= cutoff) || rows[0];
      const basePts = Object.fromEntries((baseRow.standings || []).map(t => [t.team_id, t.pts ?? 0]));
      const weekly = (latest.standings || []).map(t => ({
        id: t.team_id, name: t.name,
        pts: (t.pts ?? 0) - (basePts[t.team_id] ?? 0),
      })).sort((a, b) => b.pts - a.pts);
      const maxPts = Math.max(...weekly.map(w => w.pts), 1);
      const daySpan = Math.round((latestDate - new Date(baseRow.snapshot_date)) / 86400000);
      const rows_html = weekly.map((w, i) => {
        const isWinner = i === 0 && w.pts > 0;
        const pct = Math.max(0, (w.pts / maxPts) * 100).toFixed(1);
        return `<div class="week-review-row${isWinner ? ' winner' : ''}">
          <div class="week-review-rank${i === 0 ? ' r1' : ''}">${i === 0 && w.pts > 0 ? '👑' : i + 1}</div>
          <div class="week-review-name">${w.name}</div>
          <div class="week-review-bar-wrap"><div class="week-review-bar" style="width:${pct}%"></div></div>
          <div class="week-review-pts">${w.pts > 0 ? '+' + w.pts : w.pts}</div>
        </div>`;
      }).join('');
      return `<div class="week-review">
        <div class="week-review-title">🏆 Last ${daySpan} days</div>
        <div class="week-review-rows">${rows_html}</div>
      </div>`;
    }

    function renderBumpChart(rows, container) {
      // Stable color assignment
      const teamMeta = {};
      rows.forEach(row => {
        (row.standings || []).forEach(t => {
          if (!teamMeta[t.team_id]) {
            const idx = Object.keys(teamMeta).length % TEAM_COLORS.length;
            teamMeta[t.team_id] = { name: t.name, color: TEAM_COLORS[idx] };
          }
        });
      });

      const teamIds = Object.keys(teamMeta);
      const n = teamIds.length;
      if (n === 0) { container.innerHTML = '<div class="bump-empty">No data.</div>'; return; }

      const dates = rows.map(r => r.snapshot_date);
      const cols = dates.length;

      // Per-team data series
      const series = teamIds.map(id => {
        const points = rows.map(row => (row.standings || []).find(t => t.team_id === id) || null);
        const last = [...points].reverse().find(Boolean);
        return { id, color: teamMeta[id].color, name: teamMeta[id].name, points, last };
      });

      // Sort by latest pts desc for legend order
      series.sort((a, b) => (b.last?.pts ?? 0) - (a.last?.pts ?? 0));

      const isPts = _bumpMode === 'pts';

      // Value extractor
      const getValue = entry => entry ? (isPts ? entry.pts : entry.rank) : null;

      // Y axis range
      let yMin, yMax;
      if (isPts) {
        const allVals = series.flatMap(s => s.points.map(p => p?.pts).filter(v => v != null));
        yMin = Math.max(0, Math.min(...allVals) - 5);
        yMax = Math.max(...allVals) + 10;
      } else {
        yMin = 1; yMax = n;
      }

      // Dimensions
      const colW = Math.max(70, Math.min(120, 600 / Math.max(cols, 1)));
      const W = cols <= 1 ? 420 : cols * colW + 140;
      const H = isPts ? 260 : Math.max(220, n * 52 + 80);
      const PL = 36, PR = 110, PT = 36, PB = 32;
      const cW = W - PL - PR, cH = H - PT - PB;

      const xScale = i => PL + (cols <= 1 ? cW / 2 : (i / Math.max(cols - 1, 1)) * cW);
      const yScale = v => isPts
        ? PT + (1 - (v - yMin) / Math.max(yMax - yMin, 1)) * cH
        : PT + ((v - 1) / Math.max(n - 1, 1)) * cH;

      // Grid lines
      const gridCount = isPts ? 5 : n;
      const gridLines = Array.from({ length: gridCount }, (_, i) => {
        const v = isPts
          ? yMin + ((yMax - yMin) / (gridCount - 1)) * i
          : i + 1;
        const y = yScale(v);
        const label = isPts ? Math.round(v) : `#${i + 1}`;
        return `
          <line x1="${PL}" y1="${y}" x2="${PL + cW}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="${isPts ? '4 4' : 'none'}"/>
          <text x="${PL - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.25)" font-family="Barlow Condensed,sans-serif">${label}</text>`;
      }).join('');

      // Vertical column markers
      const colLines = dates.map((_, i) => {
        const x = xScale(i);
        return `<line x1="${x}" y1="${PT}" x2="${x}" y2="${PT + cH}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
      }).join('');

      // Date labels
      const dateLabels = dates.map((d, i) => {
        const dt = new Date(d + 'T12:00:00');
        const label = dt.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
        return `<text x="${xScale(i)}" y="${PT - 14}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)" font-family="Barlow Condensed,sans-serif" font-weight="600">${label}</text>`;
      }).join('');

      // Per-team paths, areas, dots, labels
      const teamSvg = series.map(({ id, color, name, points, last }) => {
        // Build path points
        const validPts = points.map((p, i) => {
          const v = getValue(p);
          return v != null ? { x: xScale(i), y: yScale(v), v, i } : null;
        });

        if (!validPts.some(Boolean)) return '';

        // Smooth line path
        let linePath = '';
        let prev = null;
        validPts.forEach(pt => {
          if (!pt) { prev = null; return; }
          if (!prev) { linePath += `M${pt.x},${pt.y}`; }
          else {
            const mx = (prev.x + pt.x) / 2;
            linePath += ` C${mx},${prev.y} ${mx},${pt.y} ${pt.x},${pt.y}`;
          }
          prev = pt;
        });

        // Area fill (pts mode only)
        let areaPath = '';
        if (isPts) {
          const baseline = PT + cH;
          let started = false;
          let areaTop = '';
          let firstX = 0, lastX = 0;
          validPts.forEach(pt => {
            if (!pt) return;
            if (!started) { areaTop += `M${pt.x},${pt.y}`; firstX = pt.x; started = true; }
            else {
              const prev2 = validPts[validPts.indexOf(pt) - 1];
              if (prev2) {
                const mx = (prev2.x + pt.x) / 2;
                areaTop += ` C${mx},${prev2.y} ${mx},${pt.y} ${pt.x},${pt.y}`;
              }
            }
            lastX = pt.x;
          });
          if (started) areaPath = areaTop + ` L${lastX},${baseline} L${firstX},${baseline} Z`;
        }

        // Dots
        const dots = validPts.filter(Boolean).map(pt =>
          `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="${color}" stroke="#07111f" stroke-width="2.5"/>
           <circle cx="${pt.x}" cy="${pt.y}" r="9" fill="transparent" stroke="${color}" stroke-width="0" opacity="0.3"/>`
        ).join('');

        // End label
        const lastValid = [...validPts].reverse().find(Boolean);
        const endLabel = lastValid ? `
          <text x="${lastValid.x + 14}" y="${lastValid.y - 6}" font-size="11" font-weight="700" fill="${color}" font-family="Barlow Condensed,sans-serif" letter-spacing="0.5">${name}</text>
          <text x="${lastValid.x + 14}" y="${lastValid.y + 7}" font-size="10" fill="${color}" font-family="Barlow Condensed,sans-serif" opacity="0.7">${last?.pts ?? ''}pts · #${last?.rank ?? ''}</text>
        ` : '';

        // Glow filter id
        const filterId = `glow-${id.replace(/[^a-z0-9]/gi, '')}`;

        return `
          <defs>
            <filter id="${filterId}" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="area-${filterId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="${color}" stop-opacity="0.01"/>
            </linearGradient>
          </defs>
          ${isPts && areaPath ? `<path d="${areaPath}" fill="url(#area-${filterId})"/>` : ''}
          <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#${filterId})"/>
          <path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
          ${dots}
          ${endLabel}
        `;
      }).join('');

      // Top stat cards — current standings
      const statCards = series.map(({ color, name, last }) => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid ${color}33;flex:1;min-width:110px">
          <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div>
            <div style="font-size:0.7rem;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase">${name}</div>
            <div style="font-family:'Bebas Neue',cursive;font-size:1.1rem;color:${color};letter-spacing:1px">${last?.pts ?? '—'} <span style="font-size:0.75rem;opacity:0.6">pts</span></div>
          </div>
          <div style="margin-left:auto;font-family:'Bebas Neue',cursive;font-size:1.3rem;color:rgba(255,255,255,0.15)">#${last?.rank ?? '—'}</div>
        </div>`).join('');

      // Legend
      const legend = series.map(({ color, name, last }) =>
        `<div class="bump-legend-item"><div class="bump-legend-dot" style="background:${color}"></div><span>${name}</span><span style="color:rgba(255,255,255,0.3);margin-left:4px">${last?.pts ?? ''}pts</span></div>`
      ).join('');

      container.innerHTML = buildWeeklyReview(rows) + `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem">
          <div class="pool-section-title" style="margin:0">📈 <span>${isPts ? 'POINTS OVER TIME' : 'RANK OVER TIME'}</span></div>
          <div class="bump-toggle">
            <button class="bump-toggle-btn ${isPts ? 'active' : ''}" onclick="_bumpMode='pts';_historyRenderedHtml=null;renderBumpChart(_historyCache,document.getElementById('view-history'))">Points</button>
            <button class="bump-toggle-btn ${!isPts ? 'active' : ''}" onclick="_bumpMode='rank';_historyRenderedHtml=null;renderBumpChart(_historyCache,document.getElementById('view-history'))">Rank</button>
          </div>
        </div>
        <div class="bump-stat-cards">${statCards}</div>
        <div class="bump-wrap">
          <svg class="bump-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            <rect width="${W}" height="${H}" fill="transparent"/>
            ${gridLines}
            ${colLines}
            ${dateLabels}
            ${teamSvg}
          </svg>
        </div>
        <div class="bump-legend">${legend}</div>
      `;
      _historyRenderedHtml = container.innerHTML;
    }

    load();

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePlayerModal();
    });

    document.addEventListener('wheel', e => {
      const tabs = e.target.closest('.team-tabs');
      if (!tabs) return;
      e.preventDefault();
      tabs.scrollLeft += e.deltaY || e.deltaX;
    }, { passive: false });

    // ── SHARE STANDINGS ───────────────────────────────────────────────────────────
    async function shareStandings() {
      const btn = document.getElementById('share-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Generating…';

      // Load html2canvas on demand
      if (!window.html2canvas) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
      }

      const sorted = sortedTeams();
      const leaderPts = sorted.length ? teamTotalPts(sorted[0]) : 0;

      // Top 3 insights
      const insightColors = { gold: '#ffb81c', green: '#22c55e', blue: '#7db4ff', red: '#ff5050' };
      const insightBgs    = { gold: 'rgba(255,184,28,0.08)', green: 'rgba(34,197,94,0.07)', blue: 'rgba(125,180,255,0.07)', red: 'rgba(255,80,80,0.07)' };
      const insights = computeInsightData(sorted, leaderPts).slice(0, 3);
      const insightHtml = insights.map(d => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:${insightBgs[d.color]};border:1px solid ${insightColors[d.color]}22;margin-bottom:6px">
          <div style="font-size:1.3rem;line-height:1;flex-shrink:0">${d.icon}</div>
          <div>
            <div style="font-size:0.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:1px">${d.label}</div>
            <div style="font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:1.5px;color:${insightColors[d.color]};line-height:1.2">${d.main}</div>
            <div style="font-size:0.75rem;font-weight:600;color:rgba(168,178,190,0.9);margin-top:1px">${d.sub}</div>
          </div>
        </div>`).join('');

      // Build an off-screen card to capture
      const card = document.createElement('div');
      card.style.cssText = `
        position:fixed; left:-9999px; top:0;
        width:480px; background:#07111f;
        background-image:radial-gradient(ellipse 100% 60% at 50% -10%, rgba(26,58,110,0.7) 0%, transparent 70%);
        font-family:'Barlow Condensed',sans-serif; color:white;
        padding:28px 24px 20px; border-radius:16px;
        box-shadow:0 0 0 1px rgba(255,255,255,0.1);
      `;

      const today = new Date().toLocaleDateString('en-CA', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'America/Toronto' });

      const rows = sorted.map((t, i) => {
        const pts = teamTotalPts(t);
        const sub = teamSubScores(t);
        const gap = i === 0 ? '—' : `−${teamTotalPts(sorted[0]) - pts}`;
        const medals = ['🥇','🥈','🥉'];
        const icon = medals[i] || `${i+1}`;
        const rowBg = i === 0 ? 'rgba(255,184,28,0.08)' : i === 1 ? 'rgba(168,178,190,0.05)' : i === 2 ? 'rgba(205,127,50,0.05)' : 'transparent';
        return `<div style="display:grid;grid-template-columns:32px 1fr 36px 36px 36px 52px 44px;gap:4px;align-items:center;padding:8px 10px;border-radius:7px;background:${rowBg};margin-bottom:3px;font-size:0.95rem;font-weight:600;letter-spacing:0.5px;">
          <div style="font-size:1.1rem;text-align:center">${icon}</div>
          <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</div>
          <div style="text-align:center;color:#ff7a8a;font-size:0.8rem">${sub.F + sub.BF}</div>
          <div style="text-align:center;color:#7db4ff;font-size:0.8rem">${sub.D + sub.BD}</div>
          <div style="text-align:center;color:#ffb81c;font-size:0.8rem">${sub.G + sub.BG}</div>
          <div style="text-align:center;color:#ffb81c;font-weight:800;font-size:1.05rem">${pts}</div>
          <div style="text-align:center;color:rgba(255,255,255,0.4);font-size:0.8rem">${gap}</div>
        </div>`;
      }).join('');

      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <div>
            <div style="font-family:'Bebas Neue',cursive;font-size:1.6rem;letter-spacing:3px;color:#ffb81c;line-height:1">POOL STANDINGS</div>
            <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;margin-top:2px">${_leagueName ? `${_leagueName} · ` : ''}${_leagueCode} · ${today}</div>
          </div>
          <div style="font-size:0.7rem;color:rgba(255,255,255,0.25);letter-spacing:1px">parieurdiscipline.com</div>
        </div>
        ${insightHtml ? `<div style="margin-bottom:14px">${insightHtml}</div>` : ''}
        <div style="display:grid;grid-template-columns:32px 1fr 36px 36px 36px 52px 44px;gap:4px;align-items:center;padding:4px 10px 8px;font-size:0.68rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);">
          <div></div><div>Team</div>
          <div style="text-align:center;color:#ff7a8a">F</div>
          <div style="text-align:center;color:#7db4ff">D</div>
          <div style="text-align:center;color:#ffb81c">G</div>
          <div style="text-align:center">PTS</div>
          <div style="text-align:center">GAP</div>
        </div>
        <div style="border-top:1px solid rgba(255,255,255,0.07);padding-top:8px">${rows}</div>
      `;

      document.body.appendChild(card);

      try {
        const canvas = await html2canvas(card, {
          backgroundColor: null, scale: 2, useCORS: true, logging: false
        });

        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        const file = new File([blob], 'pool-standings.png', { type: 'image/png' });

        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Pool Standings', text: `Pool standings as of ${today} — parieurdiscipline.com` });
        } else {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          btn.textContent = '✅ Copied!';
          setTimeout(() => { btn.textContent = '📸 Share'; }, 2000);
        }
      } catch(e) {
        if (e.name !== 'AbortError') alert('Could not generate image. Try again.');
      } finally {
        document.body.removeChild(card);
        btn.disabled = false;
        if (btn.textContent !== '✅ Copied!') btn.textContent = '📸 Share';
      }
    }
</script>
</body>
</html>
