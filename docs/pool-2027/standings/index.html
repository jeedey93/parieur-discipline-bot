<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pool 2026–27 Standings | Parieur Discipliné</title>
  <link rel="icon" type="image/png" href="../../parieur_discipline_icon_1024.png">
  <link rel="apple-touch-icon" href="../../parieur_discipline_icon_1024.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rink: #f5f7fa;
      --red: #c8102e;
      --gold: #d4950f;
      --silver: #374151;
      --green: #16a34a;
      --blue: #357abd;
      --pink: #e05a6e;
      --line: #e8ecf1;
      --nav-h: 44px;
    }
    body {
      background: #eef3fb;
      min-height: 100vh;
      font-family: 'Barlow Condensed', sans-serif;
      color: #1a1a1a;
      padding-top: var(--nav-h);
    }

    /* ── NAV ── */
    .site-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #1e3a8a 0%, #2c5aa0 60%, #3b6cc0 100%); border-bottom: none; box-shadow: 0 2px 16px rgba(30,58,138,0.25); }
    .site-nav-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); padding: 0 1.5rem; }
    .site-nav-brand { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; color: white; letter-spacing: 4px; text-decoration: none; flex-shrink: 0; }
    .site-nav-links { display: flex; align-items: center; gap: 0.5rem; }
    .site-nav-links a { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 600; color: rgba(255,255,255,0.85); text-decoration: none; padding: 0.3rem 0.8rem; border-radius: 5px; letter-spacing: 1.5px; transition: color 0.15s, background 0.15s; }
    .site-nav-links a:hover { color: white; background: rgba(255,255,255,0.15); }
    .site-nav-links a.active { color: white; background: rgba(255,255,255,0.2); }
    .nav-hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 36px; height: 36px; cursor: pointer; border: none; background: none; padding: 6px; border-radius: 6px; }
    .nav-hamburger span { display: block; height: 2px; background: white; border-radius: 2px; }
    .nav-drawer { display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; z-index: 99; background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%); flex-direction: column; gap: 0.25rem; padding: 1.25rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.15); }
    .nav-drawer.open { display: flex; }
    .nav-drawer a { font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 3px; color: rgba(255,255,255,0.8); text-decoration: none; padding: 0.65rem 0.75rem; border-radius: 8px; transition: color 0.15s, background 0.15s; }
    .nav-drawer a.active { color: white; background: rgba(255,255,255,0.2); }
    @media (max-width: 700px) { .site-nav-links { display: none; } .nav-hamburger { display: flex; } }

    /* ── LAYOUT ── */
    .page-wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    @media (min-width: 861px) { .page-wrap { padding: 2rem 1.5rem 4rem; } }

    /* ── HEADER ── */
    header { text-align: center; margin-bottom: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    header h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: 6px; line-height: 1; color: #1e3a8a; }
    header h1 span { color: #2563eb; }
    .participant-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; color: #6b7280; letter-spacing: 2px; text-transform: uppercase; }
    .participant-badge .count { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 3px; color: #2563eb; background: rgba(37,99,235,0.1); border: 1px solid rgba(37,99,235,0.25); border-radius: 6px; padding: 1px 10px; }

    /* ── POOL TYPE TOGGLE ── */
    .pool-type-bar { display: flex; gap: 4px; margin-bottom: 1.25rem; background: white; border: 1px solid #dce8f8; border-radius: 10px; padding: 4px; box-shadow: 0 2px 8px rgba(30,58,138,0.07); }
    .pool-type-btn { font-family: 'Bebas Neue', cursive; letter-spacing: 2px; padding: 6px 14px; border-radius: 7px; cursor: pointer; flex: 1; text-align: center; color: #4b5563; transition: all 0.15s; font-size: 0.85rem; border: none; background: none; }
    .pool-type-btn:hover { color: #1e3a8a; background: #eef3fb; }
    .pool-type-btn.active { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; box-shadow: 0 2px 8px rgba(30,58,138,0.25); }
    @media (min-width: 861px) { .pool-type-btn { font-size: 1rem; padding: 7px 20px; } }

    /* ── SKELETON ── */
    .skeleton-row { height: 52px; background: #dce8f8; border-radius: 8px; margin-bottom: 6px; animation: skeleton-pulse 1.4s ease-in-out infinite; }
    .skeleton-row:nth-child(2) { opacity: 0.75; animation-delay: 0.1s; }
    .skeleton-row:nth-child(3) { opacity: 0.6; animation-delay: 0.2s; }
    .skeleton-row:nth-child(4) { opacity: 0.45; animation-delay: 0.3s; }
    .skeleton-row:nth-child(5) { opacity: 0.3; animation-delay: 0.4s; }
    @keyframes skeleton-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }

    /* ── PODIUM ── */
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
    @media (max-width: 500px) { .podium { gap: 0.5rem; } }
    .podium-spot { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .podium-medal { font-size: 1.8rem; line-height: 1; margin-bottom: 4px; }
    .podium-name { font-family: 'Bebas Neue', cursive; font-size: clamp(0.85rem, 2vw, 1.1rem); letter-spacing: 2px; color: #1a1a1a; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-pts { font-family: 'Bebas Neue', cursive; font-size: clamp(1.3rem, 3vw, 2rem); letter-spacing: 2px; color: #1e3a8a; line-height: 1; margin-bottom: 2px; }
    .podium-cap { font-size: 0.72rem; font-weight: 600; color: #9ca3af; letter-spacing: 1px; margin-bottom: 8px; }
    .podium-block { width: 100%; border-radius: 8px 8px 0 0; }
    .podium-spot.p1 .podium-block { height: 88px; background: linear-gradient(180deg, rgba(217,119,6,0.25) 0%, rgba(217,119,6,0.06) 100%); border: 1px solid rgba(217,119,6,0.4); }
    .podium-spot.p2 .podium-block { height: 66px; background: linear-gradient(180deg, rgba(100,116,139,0.18) 0%, rgba(100,116,139,0.04) 100%); border: 1px solid rgba(100,116,139,0.3); }
    .podium-spot.p3 .podium-block { height: 50px; background: linear-gradient(180deg, rgba(205,127,50,0.2) 0%, rgba(205,127,50,0.04) 100%); border: 1px solid rgba(205,127,50,0.3); }
    .podium-spot.p1 { min-width: 140px; }
    .podium-spot.p2, .podium-spot.p3 { min-width: 105px; }

    /* ── SEARCH ── */
    .search-row { display: flex; gap: 8px; margin-bottom: 0.85rem; align-items: center; }
    .search-input { flex: 1; background: white; border: 1.5px solid #c7d7f0; border-radius: 10px; padding: 0.5rem 1rem; color: #1a1a1a; font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 4px rgba(30,58,138,0.06); }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }

    /* ── LEADERBOARD ── */
    .leaderboard { background: white; border: 1px solid #dce8f8; border-radius: 16px; overflow: hidden; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(30,58,138,0.1); }
    .lb-tiebreak-note { font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 600; color: #6b7280; letter-spacing: 0.5px; text-align: center; padding: 0.5rem 1rem 1.5rem; }
    .lb-row {
      display: grid;
      grid-template-columns: 36px 1fr 60px 58px 58px 58px 52px 60px;
      align-items: center; padding: 0.7rem 1rem; gap: 0.5rem;
      border-bottom: 1px solid #f1f7fe;
      cursor: default; transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:nth-child(even):not(.header) { background: #fafcff; }
    .lb-row:hover:not(.header) { background: #eff6ff; cursor: pointer; }
    .lb-row.header { background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 100%); border-bottom: none; padding: 0.55rem 1rem; cursor: default; }
    .lb-col-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; font-weight: 700; color: rgba(255,255,255,0.7); text-align: right; letter-spacing: 2px; text-transform: uppercase; }
    .lb-col-label.left { text-align: left; color: rgba(255,255,255,0.7); }
    .lb-row.rank-1 { background: linear-gradient(90deg, rgba(217,119,6,0.08) 0%, rgba(217,119,6,0.02) 60%, transparent 100%); border-left-color: #d97706; }
    .lb-row.rank-2 { background: linear-gradient(90deg, rgba(100,116,139,0.06) 0%, transparent 60%); border-left-color: #94a3b8; }
    .lb-row.rank-3 { background: linear-gradient(90deg, rgba(205,127,50,0.06) 0%, transparent 60%); border-left-color: #cd7f32; }
    .lb-tier-divider { height: 1px; background: linear-gradient(90deg, #bfdbfe 0%, #dce8f8 50%, transparent 100%); position: relative; }
    .lb-tier-divider::after { content: 'REST OF FIELD'; position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); font-family: 'Barlow Condensed', sans-serif; font-size: 0.55rem; font-weight: 700; letter-spacing: 2px; color: #9ca3af; background: #eef3fb; padding: 0 6px; }
    @media (min-width: 861px) { .lb-row { padding: 0.9rem 1.25rem; } }
    .lb-stat.eff { color: #16a34a; font-family: 'Bebas Neue', cursive; font-size: 0.95rem; }
    @media (max-width: 560px) {
      .lb-row { grid-template-columns: 30px 1fr 54px 54px; }
      .lb-col-hide { display: none; }
    }
    .lb-rank { display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px; color: #6b7280; text-align: center; }
    .lb-rank.gold   { color: #d97706; }
    .lb-rank.silver { color: #64748b; }
    .lb-rank.bronze { color: #cd7f32; }
    .lb-rank-crown { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .lb-rank-crown-icon { font-size: 0.65rem; line-height: 1; }
    .lb-rank-num { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 1px; }
    .lb-name { display: flex; flex-direction: column; justify-content: center; gap: 1px; overflow: hidden; min-width: 0; }
    .lb-name-team { font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 2px; color: #1a2a4a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-name-person { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 600; color: #9ca3af; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (min-width: 861px) { .lb-name-team { font-size: 1.15rem; } }
    .lb-stat { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; color: #374151; text-align: right; }
    .lb-stat.pts { color: #1e3a8a; font-family: 'Bebas Neue', cursive; font-size: 1.05rem; letter-spacing: 1px; }
    @media (min-width: 861px) { .lb-stat { font-size: 1rem; } .lb-stat.pts { font-size: 1.25rem; } }
    .paid-badge { font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 1px; background: rgba(22,163,74,0.1); border: 1px solid rgba(22,163,74,0.25); color: #16a34a; border-radius: 4px; padding: 1px 5px; margin-left: 5px; vertical-align: middle; }

    /* ── DETAIL DRAWER ── */
    .detail-drawer { background: white; border: 1px solid #dce8f8; border-radius: 16px; overflow: hidden; margin-bottom: 2rem; box-shadow: 0 8px 32px rgba(30,58,138,0.12); }
    .detail-drawer-header { padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; border-bottom: 1px solid #eef3fb; flex-wrap: wrap; background: linear-gradient(90deg, #eff6ff 0%, white 100%); }
    .detail-drawer-name { font-family: 'Bebas Neue', cursive; font-size: 1.4rem; letter-spacing: 3px; color: #1e3a8a; }
    .detail-badges { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .detail-badge { font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; padding: 3px 10px; border-radius: 6px; }
    .detail-badge.pts  { background: rgba(217,119,6,0.1); color: #d97706; border: 1px solid rgba(217,119,6,0.3); }
    .detail-badge.cap  { background: #f1f5f9; color: #374151; border: 1px solid #e2e8f0; }
    .detail-close { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1rem; padding: 4px 7px; border-radius: 6px; transition: all 0.15s; }
    .detail-close:hover { color: #1e3a8a; background: #eff6ff; }
    .pos-scores-bar { display: flex; gap: 0.75rem; padding: 0.85rem 1.25rem; border-bottom: 1px solid #eef3fb; }
    @media (max-width: 480px) { .pos-scores-bar { flex-wrap: wrap; } }
    .pos-score-block { flex: 1; border-radius: 10px; padding: 0.65rem 0.75rem; text-align: center; }
    .pos-score-block.F { background: #fff1f2; border: 1px solid #fda4af; }
    .pos-score-block.D { background: #eff6ff; border: 1px solid #93c5fd; }
    .pos-score-block.G { background: #fffbeb; border: 1px solid #fcd34d; }
    .pos-score-val { font-family: 'Bebas Neue', cursive; font-size: 1.6rem; letter-spacing: 2px; line-height: 1; }
    .pos-score-block.F .pos-score-val { color: #e05a6e; }
    .pos-score-block.D .pos-score-val { color: #2563eb; }
    .pos-score-block.G .pos-score-val { color: #d97706; }
    .pos-score-label { font-size: 0.65rem; font-weight: 700; color: #6b7280; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    /* ── ROSTER TABLE IN DETAIL ── */
    .roster-table { width: 100%; border-collapse: collapse; }
    .roster-table .section-header { font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 3px; padding: 0.35rem 1.25rem; border-bottom: 1px solid #eef3fb; }
    .roster-table .section-header.F { color: #e05a6e; background: rgba(224,90,110,0.04); }
    .roster-table .section-header.D { color: #2563eb; background: rgba(37,99,235,0.04); }
    .roster-table .section-header.G { color: #d97706; background: rgba(217,119,6,0.04); }
    .roster-table tr.player-row { border-bottom: 1px solid #f8fafc; }
    .roster-table tr.player-row:hover { background: #fafcff; }
    .roster-table tr.player-row:last-child { border-bottom: none; }
    .roster-table td { padding: 0.4rem 1.25rem; font-size: 0.88rem; font-weight: 600; }
    .roster-table .td-pos-pill { font-family: 'Bebas Neue', cursive; font-size: 0.65rem; letter-spacing: 1px; border-radius: 4px; padding: 1px 6px; }
    .roster-table .td-pos-pill.F { background: rgba(224,90,110,0.1); color: #e05a6e; }
    .roster-table .td-pos-pill.D { background: rgba(37,99,235,0.1); color: #2563eb; }
    .roster-table .td-pos-pill.G { background: rgba(217,119,6,0.1); color: #d97706; }
    .roster-table .td-name { color: #1a2a4a; }
    .roster-table .td-stat { text-align: right; color: #4b5563; font-size: 0.82rem; }
    .roster-table th.td-stat { text-align: right; font-family: 'Bebas Neue', cursive; font-size: 0.68rem; letter-spacing: 2px; color: #94a3b8; font-weight: 400; padding: 0.3rem 1.25rem; }
    .roster-table .td-pts { text-align: right; font-family: 'Bebas Neue', cursive; font-size: 1rem; color: #1e3a8a; }
    .roster-table .td-team-logo { width: 20px; height: 20px; object-fit: contain; opacity: 0.85; }

    /* ── MISC ── */
    .msg { text-align: center; color: #6b7280; font-size: 0.9rem; letter-spacing: 1px; padding: 3rem 0; }
    .btn-refresh { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; letter-spacing: 2px; background: white; border: 1px solid #dce8f8; color: #374151; border-radius: 8px; padding: 5px 16px; cursor: pointer; transition: all 0.15s; }
    .btn-refresh:hover { background: #eff6ff; color: #1e3a8a; border-color: #bfdbfe; }
    .feedback-btn { position: fixed; bottom: 1.5rem; left: 1rem; z-index: 90; display: flex; align-items: center; gap: 6px; background: white; border: 1.5px solid #dce8f8; border-radius: 20px; padding: 6px 13px 6px 10px; font-family: 'Bebas Neue', cursive; font-size: 0.78rem; letter-spacing: 1.5px; color: #6b7280; cursor: pointer; box-shadow: 0 2px 10px rgba(30,58,138,0.1); transition: border-color 0.15s, color 0.15s, box-shadow 0.15s; }
    .feedback-btn:hover { border-color: #93c5fd; color: #1e3a8a; box-shadow: 0 4px 16px rgba(30,58,138,0.15); }
    .feedback-btn .feedback-label { display: inline; }
    @media (max-width: 860px) {
      .feedback-btn { bottom: 1.5rem; left: 0.75rem; padding: 8px 10px; border-radius: 50%; width: 40px; height: 40px; justify-content: center; }
      .feedback-btn .feedback-label { display: none; }
    }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: white; border: 1px solid #e8ecf1; border-radius: 10px; padding: 1.5rem; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .modal-title { font-family: 'Bebas Neue', cursive; font-size: 1.2rem; letter-spacing: 3px; color: #1a1a1a; margin-bottom: 1rem; }
    .modal-title span { color: #2563eb; }
    .modal-input { width: 100%; font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; background: white; border: 1px solid #e8ecf1; color: #1a1a1a; border-radius: 6px; padding: 0.5rem 0.85rem; outline: none; margin-bottom: 0.85rem; transition: border-color 0.15s; display: block; }
    .modal-input:focus { border-color: rgba(37,99,235,0.5); }
    .modal-input::placeholder { color: #9ca3af; }
    .modal-type-label { font-size: 0.65rem; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; letter-spacing: 1px; color: #6b7280; text-transform: uppercase; margin-bottom: 5px; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 0.25rem; }
    .modal-btn { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; letter-spacing: 2px; border-radius: 5px; padding: 5px 18px; cursor: pointer; border: 1px solid; transition: background 0.15s; }
    .modal-btn-confirm { background: linear-gradient(135deg, #1e3a8a, #2563eb); border-color: #2563eb; color: white; }
    .modal-btn-confirm:hover:not(:disabled) { opacity: 0.88; }
    .modal-btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-btn-cancel { background: none; border-color: #e8ecf1; color: #374151; }
    .modal-btn-cancel:hover { background: #f9fafb; }

    /* ── SCORING RULES CHIP ── */
    .scoring-info { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
    .scoring-chip { display: flex; align-items: center; gap: 5px; border-radius: 7px; padding: 4px 10px; font-size: 0.72rem; }
    .scoring-chip.F { background: #fff1f2; border: 1px solid #fda4af; color: #e05a6e; }
    .scoring-chip.D { background: #eff6ff; border: 1px solid #93c5fd; color: #2563eb; }
    .scoring-chip.G { background: #fffbeb; border: 1px solid #fcd34d; color: #d97706; }
    .scoring-chip-pos { font-family: 'Bebas Neue', cursive; font-size: 0.72rem; letter-spacing: 1.5px; }
    .scoring-chip-rule { opacity: 0.75; }
  </style>
</head>

<div class="page-wrap">
  <header>
    <h1>Pool <span>2026–27</span> Standings</h1>
    <div class="participant-badge">
      <span id="participant-count-label">Loading…</span>
    </div>
  </header>

  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpZnVycWxpdGt5d3RtaGd0emV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDIyMjQsImV4cCI6MjA5MjI3ODIyNH0.KPVPj1qwbSJJMyLR_-AhDcRs0vi2sUU6qbFQ-kH53C0';

  // ── State ──────────────────────────────────────────────────────────────────

  function sbHeaders() {
    return { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function formatName(name) {
    if (!name) return '';
    if (name.includes(',')) { const [last, first] = name.split(',').map(s => s.trim()); return `${first} ${last}`; }
    return name;
  }
  function normalizePos(pos) {
    if (!pos) return 'F';
    const p = pos.toUpperCase();
    if (p.includes('G')) return 'G';
    if (p === 'D' || p.includes('LD') || p.includes('RD')) return 'D';
    return 'F';
  }
  function fmtCap(n) { return n ? `${((n / 104_000_000) * 100).toFixed(1)}% cap` : '—'; }

  // ── Scoring ────────────────────────────────────────────────────────────────
  function scoreTeam(roster) {
    let fPts = 0, dPts = 0, gPts = 0;
    for (const slug of (roster.F || [])) {
      const p = playerMap[slug];
      if (p) fPts += (p.points ?? 0) * 1;
    }
    for (const slug of (roster.D || [])) {
      const p = playerMap[slug];
      if (p) dPts += (p.goals ?? 0) * 2 + (p.assists ?? 0) * 1;
    }
    for (const slug of (roster.G || [])) {
      const p = playerMap[slug];
      if (p) gPts += (p.wins ?? 0) * 2 + (p.ot_losses ?? 0) * 1 + (p.shutouts ?? 0) * 3;
    }
    return { fPts, dPts, gPts, total: fPts + dPts + gPts };
  }

  function playerPoolScore(p) {
    const pos = normalizePos(p.position);
    if (pos === 'G') return (p.wins ?? 0) * 2 + (p.ot_losses ?? 0) * 1 + (p.shutouts ?? 0) * 3;
    if (pos === 'D') return (p.goals ?? 0) * 2 + (p.assists ?? 0) * 1;
    return (p.points ?? 0) * 1;
  }

  // ── Nav ────────────────────────────────────────────────────────────────────
  function toggleDrawer() {
    const drawer = document.getElementById('nav-drawer');
    const isOpen = drawer.classList.toggle('open');
    document.getElementById('hamburger').setAttribute('aria-expanded', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }
  document.addEventListener('click', function(e) {
    const drawer = document.getElementById('nav-drawer'), hamburger = document.getElementById('hamburger');
    if (drawer.classList.contains('open') && !drawer.contains(e.target) && !hamburger.contains(e.target)) {
      drawer.classList.remove('open'); document.body.style.overflow = '';
    }
  });

  // ── Pool filter ────────────────────────────────────────────────────────────
  function setPoolFilter(f) {
    poolFilter = f;
    ['all','paid','free'].forEach(k => document.getElementById(`btn-${k}`).classList.toggle('active', k === f));
    renderAll();
  }

  // ── Filtered + scored list ─────────────────────────────────────────────────
  function getScoredList() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    return allSubmissions
      .filter(s => {
        if (poolFilter === 'paid' && !s.paid) return false;
        if (poolFilter === 'free' && s.paid) return false;
        if (query && !s.name.toLowerCase().includes(query) && !(s.team_name || '').toLowerCase().includes(query)) return false;
        return true;
      })
      .map(s => ({ ...s, score: scoreTeam(s.roster) }))
      .sort((a, b) => b.score.total - a.score.total);
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderAll() {
    const list = getScoredList();
    const count = allSubmissions.length;

    document.getElementById('participant-count-label').innerHTML =

      return;

    let html = '';

    // Email identification banner (only when draft not locked and no email entered)

        <span style="font-family:'Bebas Neue',cursive;font-size:0.85rem;letter-spacing:2px;color:#1e3a8a;flex-shrink:0;">🔒 Rosters hidden until Oct 1</span>

        <input id="email-gate-input" type="email" placeholder="your@email.com"
          style="flex:1;min-width:180px;padding:0.4rem 0.75rem;border:1.5px solid #c7d7f0;border-radius:7px;font-size:0.9rem;font-family:'Barlow Condensed',sans-serif;outline:none;"
          onkeydown="if(event.key==='Enter')submitEmailGate()">
        <button onclick="submitEmailGate()"
          style="padding:0.4rem 1rem;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:white;border:none;border-radius:7px;font-family:'Bebas Neue',cursive;font-size:0.85rem;letter-spacing:2px;cursor:pointer;flex-shrink:0;">
          View My Team
        </button>
      </div>`;
    }

    // Podium (top 3)
    if (list.length >= 1) {

      const order = list.length >= 3 ? [1, 0, 2] : list.length === 2 ? [0, 1] : [0]; // silver, gold, bronze for visual layout
      const orderedForDisplay = list.length >= 3
        ? [list[1], list[0], list[2]]
        : list.slice(0, list.length);

          <div class="podium-medal">${medal}</div>
          <div class="podium-pts">${isMe ? sub.score.total : '—'}</div>
          <div class="podium-name">${escapeHtml(sub.team_name || sub.name)}</div>
          <div class="podium-cap" style="font-size:0.65rem;color:#9ca3af;">${escapeHtml(sub.name)}</div>
          <div class="podium-cap">${isMe ? fmtCap(sub.cap_used) : '🔒'}</div>
          <div class="podium-block"></div>
        </div>`;
      });
      html += `</div>`;
    }

    // Leaderboard
    html += `<div class="leaderboard">
      <div class="lb-row header">
        <div></div>
        <div class="lb-col-label left">Name</div>
        <div class="lb-col-label lb-col-hide">Cap</div>
        <div class="lb-col-label lb-col-hide">F</div>

    list.forEach((sub, i) => {

      const lockIcon = !isMe ? ' 🔒' : '';
      html += `<div class="lb-row${tierCls}${isActive ? ' active' : ''}" id="${rowId}" onclick="toggleDetail('${sub.id}')" style="cursor:${isMe ? 'pointer' : 'default'};">

      if (rank === 3 && list.length > 3) html += `<div class="lb-tier-divider"></div>`;
    });

    html += `</div>
    <div class="lb-tiebreak-note">🏒 Tiebreaker: lowest total cap hit wins. If still tied, the prize is split equally.</div>`;

    // Detail drawer (if one is open)
    if (activeDetailId) {
      const sub = list.find(s => s.id === activeDetailId);
      if (sub) html += buildDetailDrawer(sub);
    }

    content.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Detail drawer ──────────────────────────────────────────────────────────
  function toggleDetail(id) {
    const sub = allSubmissions.find(s => s.id === id);
    if (!DRAFT_LOCKED && sub && sub.email.toLowerCase() !== (myEmail || '').toLowerCase()) return;
    activeDetailId = activeDetailId === id ? null : id;
    renderAll();
    if (activeDetailId) {
      const el = document.getElementById(`lb-row-${id}`);
      if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    }
  }

  function buildDetailDrawer(sub) {
    const cap = fmtCap(sub.cap_used);
    let html = `<div class="detail-drawer">
      <div class="detail-drawer-header">
        <div>
          <div class="detail-drawer-name">${escapeHtml(sub.team_name || sub.name)}</div>
          ${sub.team_name ? `<div style="font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;font-weight:600;color:#9ca3af;letter-spacing:1px;margin-top:1px;">${escapeHtml(sub.name)}</div>` : ''}
        </div>
        <div class="detail-badges">
          <span class="detail-badge pts">${sub.score.total} PTS</span>
          <span class="detail-badge cap">${cap}</span>
          ${sub.paid ? '<span class="detail-badge" style="background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.3);">PAID</span>' : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button onclick="shareRoster('${sub.id}')" style="background:linear-gradient(135deg,#374151,#4b5563);color:white;border:none;border-radius:8px;padding:5px 12px;font-family:'Bebas Neue',cursive;font-size:0.85rem;letter-spacing:1.5px;cursor:pointer;">📸 SHARE</button>
          <button class="detail-close" onclick="toggleDetail('${sub.id}')">✕</button>
        </div>
      </div>
      <div class="pos-scores-bar">
        <div class="pos-score-block F"><div class="pos-score-val">${sub.score.fPts}</div><div class="pos-score-label">Forwards</div></div>
        <div class="pos-score-block D"><div class="pos-score-val">${sub.score.dPts}</div><div class="pos-score-label">Defence</div></div>
        <div class="pos-score-block G"><div class="pos-score-val">${sub.score.gPts}</div><div class="pos-score-label">Goalies</div></div>
      </div>
      <table class="roster-table">`;

    const sections = [
      { pos: 'F', label: 'Forwards', slugs: sub.roster.F || [] },
      { pos: 'D', label: 'Defencemen', slugs: sub.roster.D || [] },
      { pos: 'G', label: 'Goalies', slugs: sub.roster.G || [] },
    ];

    for (const { pos, label, slugs } of sections) {
      if (!slugs.length) continue;
      const isG = pos === 'G';
      const colspan = isG ? 6 : 6;
      let headerCols = '';
      if (isG) {
        headerCols = `<th class="td-stat">GP</th><th class="td-stat">W</th><th class="td-stat">OTL</th><th class="td-stat">SO</th>`;
      } else {
        headerCols = `<th class="td-stat">GP</th><th class="td-stat">G</th><th class="td-stat">A</th><th class="td-stat">PTS</th>`;
      }
      html += `<tr><td colspan="${colspan}" class="section-header ${pos}">${label}</td></tr>`;
      html += `<tr style="background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.06);">
        <td style="width:28px;"></td>
        <th style="text-align:left;font-family:'Bebas Neue',cursive;font-size:0.68rem;letter-spacing:2px;color:rgba(255,255,255,0.25);padding:0.25rem 1rem;font-weight:400;">Player</th>
        ${headerCols}
        <th class="td-stat" style="font-family:'Bebas Neue',cursive;font-size:0.68rem;letter-spacing:2px;color:rgba(255,255,255,0.25);font-weight:400;">FPTS</th>
      </tr>`;
      const sorted = [...slugs].map(slug => {
        const p = playerMap[slug];
        const pts = p ? playerPoolScore(p) : 0;
        return { slug, p, pts };
      }).sort((a, b) => b.pts - a.pts);

      for (const { slug, p, pts } of sorted) {
        if (!p) continue;
        const abbr = TEAM_ABBR[p.team];
        const logo = abbr ? `<img class="td-team-logo" src="https://assets.nhle.com/logos/nhl/svg/${abbr}_light.svg" alt="${abbr}">` : '';
        let statCols = '';
        if (pos === 'G') {
          statCols = `<td class="td-stat">${p.games_played ?? '—'}</td><td class="td-stat">${p.wins ?? '—'}</td><td class="td-stat">${p.ot_losses ?? '—'}</td><td class="td-stat">${p.shutouts ?? '—'}</td>`;
        } else {
          statCols = `<td class="td-stat">${p.games_played ?? '—'}</td><td class="td-stat">${p.goals ?? '—'}</td><td class="td-stat">${p.assists ?? '—'}</td><td class="td-stat">${p.points ?? '—'}</td>`;
        }
        html += `<tr class="player-row">
          <td style="width:28px;padding:0.35rem 0.5rem 0.35rem 1rem;">${logo}</td>
          <td class="td-name">${formatName(p.player_name)}</td>
          ${statCols}
          <td class="td-pts">${pts}</td>
        </tr>`;
      }
    }

    html += `</table></div>`;
    return html;
  }

  // ── Load ───────────────────────────────────────────────────────────────────
  async function load() {
    try {
      const [subsRes, playersRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/pool_2027_submissions?select=id,name,team_name,email,paid,roster,cap_used,submitted_at&order=submitted_at.desc`, { headers: sbHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/nhl_players?select=puckpedia_slug,player_name,position,cap_hit,team,goals,assists,points,wins,ot_losses,shutouts,games_played&limit=1000`, { headers: sbHeaders() }),
      ]);

      if (!subsRes.ok) throw new Error(`submissions: ${subsRes.status}`);
      if (!playersRes.ok) throw new Error(`players: ${playersRes.status}`);

      allSubmissions = await subsRes.json();
      allPlayers = await playersRes.json();
      playerMap = Object.fromEntries(allPlayers.map(p => [p.puckpedia_slug, p]));

      renderAll();
    } catch(e) {
      document.getElementById('content').innerHTML =
        `<div class="msg">Failed to load standings. <button class="btn-refresh" onclick="load()">Retry</button></div>`;
    }
  }

  function submitEmailGate() {
    const val = document.getElementById('email-gate-input')?.value.trim();
    if (!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return;
    myEmail = val;
    load();
  }

  function openFeedback() {
    document.getElementById('feedback-type').value = 'Wrong salary';
    document.getElementById('feedback-player').value = '';
    document.getElementById('feedback-message').value = '';
    document.getElementById('btn-send-feedback').disabled = false;
    document.getElementById('btn-send-feedback').textContent = 'Send';
    document.getElementById('feedback-modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('feedback-player').focus(), 60);
  }
  function closeFeedback() {
    document.getElementById('feedback-modal').classList.add('hidden');
  }
  async function sendFeedback() {
    const type    = document.getElementById('feedback-type').value;
    const player  = document.getElementById('feedback-player').value.trim();
    const message = document.getElementById('feedback-message').value.trim();
    if (!message) { alert('Please describe the issue'); return; }
    const btn = document.getElementById('btn-send-feedback');
    btn.disabled = true; btn.textContent = '…';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/pool_2027_reports`, {
        method: 'POST',
        headers: { ...sbHeaders(), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ type, player: player || null, message }),
      });
      if (!res.ok) throw new Error(res.status);
      closeFeedback();
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Send';
    }
  }

  function shareRoster(id) {
    const sub = allSubmissions.find(s => s.id === id);
    if (!sub) return;

    const sections = [
      { label: 'FORWARDS', emoji: '⚡', slugs: (sub.roster.F || []).filter(Boolean) },
      { label: 'DEFENCE',  emoji: '🛡',  slugs: (sub.roster.D || []).filter(Boolean) },
      { label: 'GOALIES',  emoji: '🥅',  slugs: (sub.roster.G || []).filter(Boolean) },
    ].filter(s => s.slugs.length);

    const W = 520, PAD = 24, ROW_H = 52, SEC_H = 36, HDR_H = 100, FTR_H = 36;
    const totalRows = sections.reduce((n, s) => n + s.slugs.length, 0);
    const H = HDR_H + sections.length * SEC_H + totalRows * ROW_H + PAD + FTR_H;

    const canvas = document.createElement('canvas');
    const DPR = 2;
    canvas.width = W * DPR; canvas.height = H * DPR;
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);

    ctx.fillStyle = '#f5f7fa'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, W, HDR_H);
    ctx.fillStyle = 'white'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
    ctx.fillText(sub.team_name || sub.name, W / 2, 38);
    if (sub.team_name) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '14px Arial';
      ctx.fillText(sub.name, W / 2, 58);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = 'bold 15px Arial';
    ctx.fillText(`Cap: $${((sub.cap_used || 0) / 1_000_000).toFixed(2)}M / $104M`, W / 2, 82);

    const AVATAR_COLORS = ['#1e3a8a','#c8102e','#006847','#003087','#ce1126','#041e42','#002654','#8b0000','#00205b','#b5985a'];
    let colorIdx = 0;

    function drawAvatar(cx, cy, initials, color) {
      ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.fillStyle = 'white'; ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(initials, cx, cy); ctx.textBaseline = 'alphabetic';
    }
    function getInitials(name) {
      const p = name.split(' ').filter(Boolean);
      return p.length >= 2 ? (p[0][0] + p[p.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
    }

    let y = HDR_H;
    sections.forEach(sec => {
      ctx.fillStyle = '#eef3fb'; ctx.fillRect(0, y, W, SEC_H);
      ctx.fillStyle = '#1e3a8a'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'left';
      ctx.fillText(`${sec.emoji}  ${sec.label} (${sec.slugs.length})`, PAD, y + 23);
      y += SEC_H;
      sec.slugs.forEach((slug, i) => {
        const p = playerMap[slug]; if (!p) return;
        ctx.fillStyle = i % 2 === 0 ? 'white' : '#f8fafd'; ctx.fillRect(0, y, W, ROW_H);
        ctx.strokeStyle = '#e8ecf1'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(PAD, y + ROW_H - 0.5); ctx.lineTo(W - PAD, y + ROW_H - 0.5); ctx.stroke();
        drawAvatar(PAD + 18, y + ROW_H / 2, getInitials(p.player_name), AVATAR_COLORS[colorIdx++ % AVATAR_COLORS.length]);
        ctx.fillStyle = '#111827'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'left';
        ctx.fillText(formatName(p.player_name), PAD + 44, y + 22);
        const abbr = TEAM_ABBR[p.team] || (p.team || '').toUpperCase().slice(0,3) || '—';
        const sal  = p.cap_hit ? `$${(p.cap_hit / 1_000_000).toFixed(2)}M` : '—';
        ctx.fillStyle = '#6b7280'; ctx.font = '12px Arial';
        ctx.fillText(`${abbr}  ·  ${sal}`, PAD + 44, y + 38);
        y += ROW_H;
      });
    });

    y += 10;
    ctx.fillStyle = '#9ca3af'; ctx.font = '11px Arial'; ctx.textAlign = 'center';
    ctx.fillText('parieurdiscipline.com/pool-2027', W / 2, y + 16);

    canvas.toBlob(blob => {
      const teamSlug = (sub.team_name || sub.name).replace(/\s+/g, '-');
      const file = new File([blob], `${teamSlug}-pool-2027.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: sub.team_name || sub.name }).catch(() => {});
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = file.name; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }
    }, 'image/png');
  }

  load();
</script>
<button class="feedback-btn" onclick="openFeedback()">🚩<span class="feedback-label"> Report an issue</span></button>

<!-- Feedback modal -->
<div class="modal-overlay hidden" id="feedback-modal">
  <div class="modal-box">
    <div class="modal-title">Report an <span>Issue</span></div>
    <div class="modal-type-label">Type</div>
    <select id="feedback-type" class="modal-input" style="cursor:pointer;">
      <option value="Wrong salary">Wrong salary</option>
      <option value="Wrong stats">Wrong stats</option>
      <option value="Wrong team">Wrong team</option>
      <option value="Missing player">Missing player</option>
      <option value="Bug">Bug</option>
      <option value="Other">Other</option>
    </select>
    <input id="feedback-player" class="modal-input" placeholder="Player name (if applicable)" autocomplete="off">
    <textarea id="feedback-message" class="modal-input" placeholder="Describe the issue…" rows="3" style="resize:vertical;"></textarea>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" onclick="closeFeedback()">Cancel</button>
      <button class="modal-btn modal-btn-confirm" id="btn-send-feedback" onclick="sendFeedback()">Send</button>
    </div>
  </div>
</div>

</body>
